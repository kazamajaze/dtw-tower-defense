;border:1px solid #3b4566;border-radius:6px;padding:3px 6px;color:#c8d5ff}.progress{height:7px;border-radius:9px;background:#242b43;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));width:0}.range{height:1px;background:var(--line);margin:12px 0}.footerhint{color:#7984a7;font-size:11px;margin-top:10px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #3a4360;border-radius:12px}.toast{position:fixed;right:18px;bottom:18px;z-index:9;background:#1c2640;border:1px solid #4b6191;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px #0008;max-width:min(90vw,420px)}.maptools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.waveitem{display:grid;grid-template-columns:50px 1fr 100px;gap:8px;align-items:center;padding:8px;border:1px solid #2c3550;border-radius:9px;margin-bottom:7px}.waveitem input,.waveitem select{width:100%;min-width:0;background:#0d1120;color:white;border:1px solid #343d5d;padding:7px;border-radius:7px}.skill{display:inline-block;padding:4px 7px;border-radius:6px;background:#232945;color:#b9d9ff;margin:2px;font-size:11px}

function loadData(){try{const x=JSON.parse(localStorage.getItem('dtwtd_data'));if(x&&x.characters&&x.monsters&&x.maps&&x.campaign)return Object.assign(clone(DEFAULTS),x)}catch(e){}const d=clone(DEFAULTS);d.campaign[0].waves=makeWaves(d.monsters);return d}
function makeWaves(monsters){return Array.from({length:12},(_,i)=>({count:7+i*2,interval:0.8,break:3,health:1+i*.13,speed:1+i*.025,boss:i===11,monsterId:i===11?'m4':(i%4===2?'m3':i%3===1?'m2':'m1'),rules:{hp:1,elementBonus:'',elementResist:'',attackRate:1,limit:0}}))}
function ensure(){if(!data.campaign[0].waves||data.campaign[0].waves.length!==12)data.campaign[0].waves=makeWaves(data.monsters);for(const s of data.campaign){if(!s.waves||s.waves.length!==12)s.waves=makeWaves(data.monsters)}}
ensure();
function save(){try{localStorage.setItem('dtwtd_data',JSON.stringify(data));return true}catch(e){toast('Không thể lưu: dữ liệu có thể quá lớn. Hãy giảm kích thước ảnh bản đồ hoặc Export Project.','error');return false}}
function toast(msg,type=''){const el=$('#toast');el.textContent=msg;el.className='toast'+(type?' '+type:'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3500)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return Math.round(n).toLocaleString('vi-VN')}
function id(prefix){return prefix+Math.random().toString(36).slice(2,9)}
function activeMap(){return data.maps.find(m=>m.id===(selectedMap||data.campaign[0]?.mapId))||data.maps[0]}
function activeStage(){return data.campaign.find(s=>s.id===selectedStage)||data.campaign[0]}
function nav(t){if(battle&&battle.running){toast('Hãy tạm dừng trận đấu trước khi chuyển tab.');return}tab=t;$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('#pageTitle').textContent=({Battle:'Battlefield',Characters:'Character Forge',Monsters:'Monster Lab','Map Editor':'Map Editor',Campaign:'Campaign Builder',Collection:'Collection',Settings:'Settings'})[t]||t;$('#pageSub').textContent=({Battle:'Triển khai nhân vật, sống sót qua 12 wave.',Characters:'Tạo và cân bằng các đơn vị chiến đấu.',Monsters:'Thiết kế quái vật và vai trò trong wave.','Map Editor':'Tải ảnh nền, vẽ đường đi và vùng đặt nhân vật.',Campaign:'Cấu hình màn chơi và luật từng wave.',Collection:'Nhân vật đã mở khóa.',Settings:'Lưu trữ và tùy chỉnh trải nghiệm.'})[t];render()}
$$('.nav').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.tab)));
function updateHeader(){$('#topGems').textContent=fmt(data.shards);$('#topWins').textContent=data.wins}
function render(){updateHeader();const v=$('#view');if(tab==='Battle')v.innerHTML=renderBattle();if(tab==='Characters')v.innerHTML=renderCharacters();if(tab==='Monsters')v.innerHTML=renderMonsters();if(tab==='Map Editor')v.innerHTML=renderMapEditor();if(tab==='Campaign')v.innerHTML=renderCampaign();if(tab==='Collection')v.innerHTML=renderCollection();if(tab==='Settings')v.innerHTML=renderSettings();wireTab();if(tab==='Battle')drawBattle();if(tab==='Map Editor')drawEditor()}
function unitCard(c,kind='char'){return `<div class="unit ${((kind==='char'?selectedChar:selectedMonster)===c.id?'selected':'')}" data-select-${kind}="${c.id}"><div class="avatar" style="color:${COLORS[c.element]||c.color||'#fff'}">${esc(c.icon||'✦')}</div><div class="meta"><b>${esc(c.name)}</b><span class="sub">${esc(c.element||c.role||'')} · ${esc(c.rarity||c.role||'')}</span></div><span class="tag">${kind==='char'?c.cost+' ✧':c.hp+' HP'}</span></div>`}
function renderBattle(){const stage=activeStage(),map=data.maps.find(m=>m.id===stage.mapId)||activeMap();return `<div class="layout"><div class="stack"><div class="panel"><div class="row between"><div><h2>⚔ ${esc(stage.name)}</h2><div class="sub">Map: ${esc(map.name)} · ${stage.waves.length} waves</div></div><div class="row"><button id="startBtn" class="primary" ${battle?.running?'disabled':''}>▶ ${battle?.ended?'Chơi lại':'Bắt đầu'}</button><button id="pauseBtn" ${!battle?.running?'disabled':''}>Ⅱ ${battle?.paused?'Tiếp tục':'Tạm dừng'}</button><button id="speedBtn">⏩ ${data.settings.speed}x</button></div></div><div class="canvaswrap"><canvas id="battleCanvas" width="900" height="500"></canvas></div><div class="legend"><span><i class="dot" style="background:#ff6688"></i>Quái</span><span><i class="dot" style="background:#55c8ff"></i>Nhân vật</span><span><i class="dot" style="background:#ffd477"></i>Goal</span><span>Click vùng sáng để đặt đơn vị đã chọn</span></div></div><div class="panel"><div class="row between"><h2>Đội hình</h2><span class="sub" id="battleStatus">${battle?.ended?(battle.won?'CHIẾN THẮNG':'THẤT BẠI'):(battle?.running?'ĐANG CHIẾN ĐẤU':'SẴN SÀNG')}</span></div><div class="grid3"><div class="stat"><span class="sub">Tài nguyên</span><b id="goldVal">${battle?fmt(battle.gold):fmt(stage.gold)}</b></div><div class="stat"><span class="sub">Mạng sống</span><b id="livesVal">${battle?battle.lives:stage.lives}</b></div><div class="stat"><span class="sub">Wave</span><b id="waveVal">${battle?Math.min(12,battle.wave+1):0}/12</b></div></div><div class="progress" style="margin-top:12px"><i id="waveProgress" style="width:${battle?battle.wave/12*100:0}%"></i></div><div class="sub" id="battleMessage" style="margin-top:8px">${battle?.message||'Chọn một nhân vật ở bảng bên phải, sau đó đặt vào vùng hợp lệ trên bản đồ.'}</div></div></div><aside class="stack"><div class="panel"><h2>✦ Chọn nhân vật</h2><div class="unitlist">${data.characters.map(c=>{const used=!!(battle&&battle.usedCharIds?.includes(c.id));return `<div class="unit ${selectedChar===c.id?'selected':''} ${used?'used-unit':''}" data-select-char="${c.id}" style="${used?'opacity:.48;cursor:not-allowed;':''}"><div class="avatar" style="color:${COLORS[c.element]||'#fff'}">${esc(c.icon||'✦')}</div><div class="meta"><b>${esc(c.name)}</b><span class="sub">${esc(c.element||'')} · ${used?'ĐÃ ĐẶT TRẬN NÀY':esc(c.rarity||'')}</span></div><span class="tag">${used?'Đã dùng':c.cost+' ✧'}</span></div>`}).join('')||'<div class="empty">Chưa có nhân vật.</div>'}</div></div><div class="panel" id="selectedInfo"><h2>Thông tin đơn vị</h2>${selectedChar?charInfo(data.characters.find(c=>c.id===selectedChar)):('<p class="muted">Chọn nhân vật để xem chỉ số.</p>')}</div><div class="panel"><h3>Điều khiển</h3><div class="small muted">• Đặt đơn vị lên vùng màu xanh.<br>• Chọn đơn vị đã đặt để nâng cấp hoặc bán.<br>• Quái chạm Goal sẽ làm mất mạng.<br>• Tiêu diệt boss ở wave 12 để thắng.</div></div></aside></div>`}
function charInfo(c){if(!c)return'<p class="muted">Nhân vật không tồn tại.</p>';return `<div class="row"><div class="avatar">${esc(c.icon)}</div><div><b>${esc(c.name)}</b><div class="rarity">${esc(c.rarity)}</div></div></div><div class="range"></div><div class="grid2"><div><span class="sub">Sát thương</span><b>${c.damage}</b></div><div><span class="sub">Tầm đánh</span><b>${c.range}</b></div><div><span class="sub">Tốc độ đánh</span><b>${c.rate}/s</b></div><div><span class="sub">Nguyên tố</span><b>${esc((c.elements||[c.element]).join(' + '))}</b></div></div><p class="small">${esc(c.desc)}</p><div class="small muted">Nội tại nguyên tố: ${esc(({Hỏa:'Thiêu đốt',Thủy:'Làm chậm',Băng:'Choáng',Lôi:'Đánh lan',Phong:'Đẩy lùi',Mộc:'Hồi máu nhà mỗi 8 giây',Kim:'Tăng 25% sát thương cho đồng minh trong bán kính 110',Thổ:'Tạo thêm 5 tài nguyên mỗi 5 giây'})[c.element]||c.passive||'Không có')}</div><div>${(c.skills||'').split(',').filter(Boolean).map(s=>`<span class="skill">${esc(s.trim())}</span>`).join('')}</div><div>${(c.effects||[]).map(e=>`<span class="skill">${({slow:'Làm chậm',burn:'Thiêu đốt',chain:'Đánh lan',splash:'Diện rộng',poison:'Độc',stun:'Choáng'}[e.type]||esc(e.type))} · ${e.power} / ${e.duration}s</span>`).join('')}</div>`}
function renderCharacters(){const c=data.characters.find(x=>x.id===editIndex)||{};return `<div class="layout"><div class="panel"><div class="row between"><h2>Nhân vật của bạn</h2><button class="primary" id="newChar" type="button">＋ Tạo nhân vật</button></div><div class="unitlist">${data.characters.map(x=>`<div class="unit ${x.id===editIndex?'selected':''}" data-edit-char="${x.id}"><div class="avatar">${esc(x.icon||'✦')}</div><div class="meta"><b>${esc(x.name)}</b><span class="sub">${esc((x.elements||[x.element]).join(' + '))} · ${esc(x.rarity)}</span></div><button data-delete-char="${x.id}" class="danger">Xóa</button></div>`).join('')}</div></div><div class="panel"><h2>${editIndex?'Chỉnh sửa nhân vật':'Tạo nhân vật mới'}</h2><form id="charForm" class="stack"><input type="hidden" name="id" value="${esc(c.id||'')}"><div class="grid2"><label class="field">Tên<input name="name" required maxlength="40" value="${esc(c.name||'')}"></label><label class="field">Biểu tượng emoji<input name="icon" maxlength="8" value="${esc(c.icon||'✨')}"></label><label class="field">Độ hiếm<select name="rarity">${['Common','Rare','Epic','Legendary','Mythic'].map(x=>`<option ${c.rarity===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field" style="display:flex;align-items:center;gap:8px"><input name="chestEnabled" type="checkbox" value="true" ${(c.chestEnabled!==false)?'checked':''} style="width:auto"> Có thể xuất hiện trong rương</label><div class="field" style="grid-column:1/-1"><b>Nguyên tố (có thể chọn nhiều)</b><div class="grid3" id="elementChoices">${Object.keys(COLORS).map(x=>`<label class="field" style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="elements" value="${x}" ${(c.elements||[c.element||'Thủy']).includes(x)?'checked':''} style="width:auto"> <span style="color:${COLORS[x]}">${x}</span></label>`).join('')}</div><div class="small muted">Có thể chọn nhiều nguyên tố cho cùng một nhân vật. Chỉ các nguyên tố được chọn mới có hiệu ứng và hiện phần thông số tương ứng.</div></div><label class="field">Giá đặt<input name="cost" type="number" min="0" value="${c.cost??100}"></label><label class="field">Sát thương<input name="damage" type="number" min="1" value="${c.damage??20}"></label><label class="field">Tầm đánh<input name="range" type="number" min="20" value="${c.range??130}"></label><label class="field">Tốc độ đánh / giây<input name="rate" type="number" min=".1" max="10" step=".1" value="${c.rate??1}"></label><label class="field">Loại tấn công<select name="type">${[['single','Đơn mục tiêu'],['aoe','Diện rộng'],['pierce','Xuyên mục tiêu'],['chain','Lan mục tiêu'],['support','Hỗ trợ']].map(([v,l])=>`<option value="${v}" ${c.type===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field">Tốc độ đạn<input name="projectile" type="number" min="50" value="${c.projectile??350}"></label><label class="field">Hồi chiêu (giây)<input name="cooldown" type="number" min="0" value="${c.cooldown??8}"></label><label class="field">Kỹ năng (phân tách bằng dấu phẩy)<input name="skills" value="${esc(c.skills||'Kỹ năng đặc biệt')}"></label></div><label class="field">Mô tả<textarea name="desc">${esc(c.desc||'')}</textarea></label><label class="field">Nội tại<textarea name="passive">${esc(c.passive||'')}</textarea></label><div class="range"></div><h3>Thông số nội tại nguyên tố</h3><div class="small muted">Loại khả năng do nguyên tố quyết định; bạn tự chỉnh sức mạnh, thời gian, phạm vi và chu kỳ tại đây. Chọn một hoặc nhiều nguyên tố; chỉ các phần thông số thuộc nguyên tố đã chọn mới hiện ra và được dùng trong trận.</div><div class="grid2">
<label class="field" data-element-section="Hỏa">Hỏa — sát thương thiêu đốt mỗi giây<input name="burnDps" type="number" min="0" step="1" value="${c.elementParams?.burnDps??6}"></label><label class="field" data-element-section="Hỏa">Hỏa — thời gian thiêu đốt (giây)<input name="burnDuration" type="number" min="0.1" step="0.1" value="${c.elementParams?.burnDuration??2}"></label>
<label class="field" data-element-section="Thủy">Thủy — % giảm tốc độ<input name="slowPercent" type="number" min="0" max="95" step="1" value="${c.elementParams?.slowPercent??35}"></label><label class="field" data-element-section="Thủy">Thủy — thời gian làm chậm (giây)<input name="slowDuration" type="number" min="0.1" step="0.1" value="${c.elementParams?.slowDuration??1.5}"></label>

<label class="field" data-element-section="Mộc">Mộc — chu kỳ hồi máu (giây)<input name="woodInterval" type="number" min="0.1" step="0.1" value="${c.elementParams?.woodInterval??8}"></label><label class="field" data-element-section="Kim">Kim — % tăng sát thương đồng minh<input name="metalBuff" type="number" min="0" max="500" step="1" value="${c.elementParams?.metalBuff??25}"></label>
<label class="field" data-element-section="Kim">Kim — bán kính buff (px)<input name="metalRange" type="number" min="0" step="5" value="${c.elementParams?.metalRange??110}"></label><label class="field" data-element-section="Thổ">Thổ — tài nguyên nhận mỗi lần<input name="earthGold" type="number" min="0" step="1" value="${c.elementParams?.earthGold??5}"></label>
<label class="field" data-element-section="Thổ">Thổ — chu kỳ tạo tài nguyên (giây)<input name="earthInterval" type="number" min="0.1" step="0.1" value="${c.elementParams?.earthInterval??5}"></label></div><button class="primary" type="submit">Lưu nhân vật</button><div class="sub">Nhấn Lưu nhân vật để ghi thay đổi vào dữ liệu. Dữ liệu cũng được lưu trong trình duyệt.</div></form></div></div>`}
function renderMonsters(){const m=data.monsters.find(x=>x.id===editIndex)||{};return `<div class="layout"><div class="panel"><div class="row between"><h2>Danh sách quái vật</h2><button id="newMonster" class="primary">＋ Tạo quái</button></div><div class="unitlist">${data.monsters.map(x=>`<div class="unit ${x.id===editIndex?'selected':''}" data-edit-monster="${x.id}"><div class="avatar" style="color:${x.color}">${esc(x.icon||'●')}</div><div class="meta"><b>${esc(x.name)}</b><span class="sub">${esc(x.role)} · ${x.hp} HP</span></div><button class="danger" data-delete-monster="${x.id}">Xóa</button></div>`).join('')}</div></div><div class="panel"><h2>${editIndex?'Chỉnh sửa quái':'Tạo quái vật'}</h2><form id="monsterForm" class="stack"><input type="hidden" name="id" value="${esc(m.id||'')}"><div class="grid2"><label class="field">Tên<input name="name" required value="${esc(m.name||'')}"></label><label class="field">Biểu tượng<input name="icon" value="${esc(m.icon||'●')}"></label><label class="field">Vai trò<select name="role">${[['normal','Quái thường'],['fast','Quái nhanh'],['armored','Giáp cao'],['flying','Quái bay'],['healer','Hồi phục'],['support','Hỗ trợ'],['boss','Boss']].map(([v,l])=>`<option value="${v}" ${m.role===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field">Màu<input name="color" type="color" value="${m.color||'#ff6688'}"></label><label class="field">Máu<input name="hp" type="number" min="1" value="${m.hp??100}"></label><label class="field">Tốc độ<input name="speed" type="number" min="1" value="${m.speed??40}"></label><label class="field">Giáp<input name="armor" type="number" min="0" value="${m.armor??0}"></label><label class="field">Thưởng tài nguyên<input name="reward" type="number" min="0" value="${m.reward??10}"></label><label class="field">Kích thước<input name="size" type="number" min="4" max="40" value="${m.size??10}"></label><label class="field">Kháng nguyên tố<select name="resist"><option value="">Không</option>${Object.keys(COLORS).map(x=>`<option ${m.resist===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Miễn nhiễm trạng thái<input name="immune" value="${esc(m.immune||'')}"></label><label class="field">Kỹ năng đặc biệt<select name="ability">${[['','Không'],['shield','Tạo khiên'],['regen','Hồi máu'],['haste','Tăng tốc'],['summon','Triệu hồi quái nhỏ']].map(([v,l])=>`<option value="${v}" ${m.ability===v?'selected':''}>${l}</option>`).join('')}</select></label></div><button class="primary" type="submit">Lưu quái vật</button></form></div></div>`}
function renderMapEditor(){const m=data.maps.find(x=>x.id===editIndex)||activeMap()||{name:'',path:[],zones:[]};return `<div class="layout"><div class="panel"><div class="row between"><h2>⌖ Trình chỉnh sửa bản đồ</h2><button id="newMap" class="primary">＋ Bản đồ mới</button></div><label class="field">Chọn bản đồ<select id="mapSelect">${data.maps.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="row" style="margin-top:10px"><label class="field" style="flex:1">Tên bản đồ<input id="mapName" value="${esc(m.name)}"></label><label class="field">Tải ảnh nền<input id="mapUpload" type="file" accept="image/png,image/jpeg,image/webp"></label></div><div class="maptools"><button data-mode="path" class="${editorMode==='path'?'primary':''}">✎ Vẽ đường đi</button><button data-mode="zones" class="${editorMode==='zones'?'primary':''}">▣ Vùng đặt</button><button id="undoPoint">↶ Xóa điểm cuối</button><button id="clearPath" class="danger">Xóa đường đi</button><button id="clearZones" class="danger">Xóa vùng</button><button id="setSpawn">Đặt Spawn</button><button id="setGoal">Đặt Goal</button></div><div class="canvaswrap"><canvas id="editorCanvas" width="900" height="500"></canvas></div><div class="legend"><span><i class="dot" style="background:#ff6688"></i>Đường quái</span><span><i class="dot" style="background:#67e8b0"></i>Vùng đặt</span><span><i class="dot" style="background:#ffd477"></i>Goal</span><span>Chế độ đường đi: click thêm điểm; kéo điểm để di chuyển.</span></div><div class="row" style="margin-top:12px"><button class="primary" id="saveMap">Lưu & kiểm tra bản đồ</button><button id="deleteMap" class="danger" ${data.maps.length<=1?'disabled':''}>Xóa bản đồ</button></div><div id="mapValidation" class="footerhint"></div></div><aside class="stack"><div class="panel"><h2>Hướng dẫn nhanh</h2><div class="small muted">1. Tải ảnh nền (không bắt buộc).<br>2. Chọn Vẽ đường đi, nhấp để tạo các điểm từ Spawn đến Goal.<br>3. Chọn Vùng đặt rồi nhấp để thêm vị trí đặt nhân vật.<br>4. Kéo các điểm để chỉnh sửa. Chọn một điểm rồi bấm Xóa điểm cuối để gỡ điểm cuối.</div></div><div class="panel"><h3>Thông tin bản đồ</h3><div class="stat"><span class="sub">Điểm đường đi</span><b id="pathCount">${m.path?.length||0}</b></div><div class="stat" style="margin-top:8px"><span class="sub">Vùng đặt</span><b id="zoneCount">${m.zones?.length||0}</b></div><div class="footerhint">Ảnh nền lưu trong trình duyệt; ảnh quá lớn có thể vượt giới hạn lưu trữ.</div></div></aside></div>`}
function renderCampaign(){const s=data.campaign.find(x=>x.id===editIndex)||activeStage();if(!s)return'<div class="empty">Hãy tạo màn chơi đầu tiên.</div>';return `<div class="layout"><div class="panel"><div class="row between"><h2>▤ Danh sách màn chơi</h2><button id="newStage" class="primary">＋ Tạo màn</button></div>${data.campaign.map(x=>`<div class="unit ${x.id===s.id?'selected':''}" data-edit-stage="${x.id}"><div class="avatar">⚑</div><div class="meta"><b>${esc(x.name)}</b><span class="sub">Độ khó ${x.difficulty} · ${x.waves.length} wave</span></div><button data-delete-stage="${x.id}" class="danger">Xóa</button></div>`).join('')}</div><div class="panel"><h2>Thiết lập màn chơi</h2><form id="stageForm" class="stack"><input type="hidden" name="id" value="${s.id}"><div class="grid2"><label class="field">Tên màn<input name="name" required value="${esc(s.name)}"></label><label class="field">Bản đồ<select name="mapId">${data.maps.map(m=>`<option value="${m.id}" ${s.mapId===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><label class="field">Độ khó<input name="difficulty" type="number" min="1" max="20" value="${s.difficulty}"></label><label class="field">Mạng ban đầu<input name="lives" type="number" min="1" value="${s.lives}"></label><label class="field">Tài nguyên ban đầu<input name="gold" type="number" min="0" value="${s.gold}"></label><label class="field">Phần thưởng thắng<input name="reward" type="number" min="0" value="${s.reward}"></label></div><button class="primary" type="submit">Lưu màn chơi</button></form><div class="range"></div><h3>Cấu hình 12 wave</h3><div class="small muted">Mỗi wave có loại quái, số lượng, nhịp xuất hiện, hệ số máu/tốc độ, boss và luật khắc chế riêng.</div><div id="waveEditor">${s.waves.map((w,i)=>`<div class="waveitem" data-wave="${i}"><b>W${i+1}${w.boss?' ♛':''}</b><div class="stack" style="gap:5px"><select data-wkey="monsterId">${data.monsters.map(m=>`<option value="${m.id}" ${w.monsterId===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><div class="grid2"><label class="small">Số lượng<input data-wkey="count" type="number" min="1" max="100" value="${w.count}"></label><label class="small">Nhịp (s)<input data-wkey="interval" type="number" min=".1" step=".1" value="${w.interval}"></label><label class="small">Máu x<input data-wkey="health" type="number" min=".1" step=".1" value="${w.health}"></label><label class="small">Tốc độ x<input data-wkey="speed" type="number" min=".1" step=".1" value="${w.speed}"></label><label class="small">Nghỉ wave (s)<input data-wkey="break" type="number" min="0" step=".5" value="${w.break}"></label><label class="small">Giới hạn unit<input data-wkey="limit" type="number" min="0" value="${w.rules?.limit||0}"></label></div><label class="small"><input data-wkey="boss" type="checkbox" ${w.boss?'checked':''}> Wave boss</label></div></div>`).join('')}</div><button id="saveWaves" class="primary">Lưu cấu hình wave</button></div></div>`}
function renderCollection(){return `<div class="panel"><div class="row between"><h2>♜ Collection</h2><span class="tag">${data.collection.length} đã sở hữu</span></div><p class="muted small">Mỗi chiến thắng nhận 1 rương. Chỉ nhân vật được đánh dấu “Có thể xuất hiện trong rương” mới nằm trong bể quay; nhân vật đã nhận sẽ không xuất hiện lần nữa. Khi đã sở hữu hết nhân vật trong bể, rương đổi thành shards.</p><div class="grid3">${data.collection.map(id=>data.characters.find(c=>c.id===id)).filter(Boolean).map(c=>`<div class="stat"><div class="row"><div class="avatar">${esc(c.icon)}</div><div><b>${esc(c.name)}</b><div class="rarity">${esc(c.rarity)}</div></div></div><div class="small muted" style="margin-top:9px">${esc(c.element)} · ${c.damage} DMG · ${c.range} range</div></div>`).join('')||'<div class="empty">Chưa có nhân vật. Hãy thắng trận để mở khóa!</div>'}</div><div class="range"></div><div class="row"><span>Chiến thắng: <b>${data.wins}</b></span><span>Rương đã nhận: <b>${data.chestsClaimed}</b></span><button id="openChest" class="primary" ${data.wins<=data.chestsClaimed?'disabled':''}>🎁 Mở rương nhân vật</button></div></div>`}
function renderSettings(){return `<div class="layout"><div class="panel"><h2>⚙ Cài đặt</h2><div class="stack"><label class="row"><input type="checkbox" id="soundSetting" ${data.settings.sound?'checked':''}> Bật hiệu ứng âm thanh (tùy chọn)</label><label class="field">Tốc độ game mặc định<select id="defaultSpeed">${[1,1.5,2,3].map(n=>`<option value="${n}" ${data.settings.speed===n?'selected':''}>${n}x</option>`).join('')}</select></label><div class="row"><button id="saveSettings" class="primary">Lưu cài đặt</button><button id="resetData" class="danger">Khôi phục dữ liệu mẫu</button></div></div></div><div class="panel"><h2>Dữ liệu dự án</h2><p class="muted small">Dữ liệu lưu cục bộ trên trình duyệt này bằng localStorage. Hãy xuất JSON để sao lưu. Ảnh bản đồ lớn có thể khiến trình duyệt từ chối lưu.</p><div class="stat"><span class="sub">Nhân vật / Quái / Bản đồ / Màn chơi</span><b>${data.characters.length} / ${data.monsters.length} / ${data.maps.length} / ${data.campaign.length}</b></div><div class="row" style="margin-top:12px"><button id="exportBtn2">Export JSON</button><button id="importBtn2">Import JSON</button></div></div></div>`}
function wireTab(){

Math.max(0,ep.slowPercent??35))/100)}if(els.includes('Băng'))target.stun=Math.max(target.stun||0,ep.stunDuration??.65);if(els.includes('Phong'))target.push=Math.max(target.push||0,ep.pushDistance??45);if(burnFx){target.burn=Math.max(target.burn||0,burnFx.duration||c.effectDuration||2);target.burnPower=burnFx.power||c.effectPower||6}if(poisonFx){target.poison=Math.max(target.poison||0,poisonFx.duration||c.effectDuration||2);target.poisonPower=poisonFx.power||c.effectPower||4}if(slowFx){target.slow=Math.max(target.slow||0,slowFx.duration||c.effectDuration||2);target.slowFactor=Math.max(.1,1-(slowFx.power||c.effectPower||50)/100)}if(stunFx)target.stun=Math.max(target.stun||0,Math.min(2,stunFx.duration||.5));if(c.type==='aoe'||getFx('splash'))for(const other of battle.enemies){if(other!==target&&!other.dead&&Math.hypot(other.x-target.x,other.y-target.y)<55){other.hp-=dmg*.55;if(other.hp<=0)killEnemy(other)}}if(c.type==='chain'||els.includes('Lôi')||getFx('chain')){const count=els.includes('Lôi')?Math.max(0,ep.chainCount??1):1;const radius=els.includes('Lôi')?(ep.chainRange??85):85;const pct=els.includes('Lôi')?(ep.chainPercent??55):55;let origin=target;const hit=new Set([target.id]);for(let j=0;j<count;j++){const second=battle.enemies.filter(e=>!e.dead&&!hit.has(e.id)&&Math.hypot(e.x-origin.x,e.y-origin.y)<radius).sort((a,b)=>Math.hypot(a.x-origin.x,a.y-origin.y)-Math.hypot(b.x-origin.x,b.y-origin.y))[0];if(!second)break;second.hp-=dmg*pct/100;hit.add(second.id);battle.effects.push({x:origin.x,y:origin.y,tx:second.x,ty:second.y,color:COLORS.Lôi,life:.16,type:'shot'});if(second.hp<=0)killEnemy(second);origin=second;}}if(c.type==='pierce'){let second=battle.enemies.find(e=>e!==target&&!e.dead&&Math.hypot(e.x-target.x,e.y-target.y)<35);if(second)second.hp-=dmg*.45}u.cool=1/Math.max(.1,c.rate);if(target.hp<=0)killEnemy(target)}}}
battle.effects.forEach(e=>e.life-=dt);battle.effects=battle.effects.filter(e=>e.life>0);battle.enemies=battle.enemies.filter(e=>!e.dead);if(w&&battle.spawned>=w.count&&battle.enemies.length===0){battle.breakTimer+=dt;if(battle.breakTimer>=(w.break||3)){if(battle.wave===11)finishBattle(true);else beginWave()}}}
function killEnemy(e){if(e.dead)return;e.dead=true;const m=data.monsters.find(m=>m.id===e.monsterId);battle.gold+=(m?.reward||10);battle.dead++;if(e.isBoss)battle.message='Boss đã bị tiêu diệt!'}
function finishBattle(won){if(!battle||battle.ended)return;battle.ended=true;battle.running=false;battle.won=won;battle.message=won?'Chiến thắng! Bạn đã vượt qua 12 wave.':'Thất bại — mạng sống đã hết.';if(won){const stage=data.campaign.find(s=>s.id===battle.stageId);data.wins++;data.shards+=stage.reward||100;data.completed=[...new Set([...data.completed,stage.id])];battle.message+=' Bạn nhận được 1 rương nhân vật! Vào Collection để mở.';save();toast('Chiến thắng! Nhận '+(stage.reward||100)+' shards.','success')}else toast('Trận đấu kết thúc. Hãy thử chiến thuật khác.','error');render()}
function updateBattleUI(){if(!battle)return;const gold=$('#goldVal'),lives=$('#livesVal'),wave=$('#waveVal'),progress=$('#waveProgress'),message=$('#battleMessage'),status=$('#battleStatus'),pause=$('#pauseBtn'),start=$('#startBtn');if(gold)gold.textContent=fmt(battle.gold);if(lives)lives.textContent=battle.lives;if(wave)wave.textContent=Math.min(12,Math.max(0,battle.wave+1))+'/12';if(progress)progress.style.width=Math.max(0,(battle.wave+1)/12*100)+'%';if(message)message.textContent=battle.message;if(status)status.textContent=battle.ended?(battle.won?'CHIẾN THẮNG':'THẤT BẠI'):battle.paused?'TẠM DỪNG':'ĐANG CHIẾN ĐẤU';if(pause)pause.disabled=!battle.running;if(start)start.disabled=battle.running&&!battle.ended;}
function drawBattle(){const c=$('#battleCanvas');if(!c)return;const ctx=c.getContext('2d');drawMap(ctx,activeMap(),battle?.mapId);if(!battle)return;const map=data.maps.find(m=>m.id===battle.mapId)||activeMap();for(const z of map.zones){ctx.beginPath();ctx.arc(z.x*900,z.y*500,z.r*900,0,Math.PI*2);ctx.fillStyle='#55c8ff18';ctx.fill();ctx.strokeStyle='#55c8ff66';ctx.stroke()}for(const u of battle.units){const ch=data.characters.find(c=>c.id===u.charId);if(!ch)continue;if(showRange||u.id===battle.selectedUnit){ctx.beginPath();ctx.arc(u.x,u.y,ch.range,0,Math.PI*2);ctx.fillStyle='#55c8ff0b';ctx.fill();ctx.strokeStyle='#55c8ff25';ctx.stroke()}ctx.beginPath();ctx.arc(u.x,u.y,15,0,Math.PI*2);ctx.fillStyle=COLORS[ch.element]||'#55c8ff';ctx.fill();ctx.strokeStyle=u.id===battle.selectedUnit?'#fff':'#a9caff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#101526';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText(ch.icon||'✦',u.x,u.y+5);ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.fillText('Lv.'+(u.level+1),u.x,u.y+27)}for(const e of battle.enemies){ctx.beginPath();ctx.arc(e.x,e.y,e.size||10,0,Math.PI*2);ctx.fillStyle=e.color;ctx.fill();ctx.strokeStyle=e.isBoss?'#ffd477':'#ffe4f0';ctx.lineWidth=e.isBoss?3:1;ctx.stroke();const w=e.isBoss?52:30;ctx.fillStyle='#281421';ctx.fillRect(e.x-w/2,e.y-(e.size||10)-9,w,4);ctx.fillStyle='#ff6688';ctx.fillRect(e.x-w/2,e.y-(e.size||10)-9,w*Math.max(0,e.hp/e.maxHp),4)}for(const e of battle.effects){ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.ty);ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.globalAlpha=Math.min(1,e.life*8);ctx.stroke();ctx.globalAlpha=1}}
function drawMap(ctx,m,mapId){ctx.clearRect(0,0,900,500);ctx.fillStyle='#11192b';ctx.fillRect(0,0,900,500);ctx.save();ctx.strokeStyle='#1d2941';ctx.lineWidth=1;for(let x=0;x<900;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke()}for(let y=0;y<500;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}ctx.restore();if(m?.image){let img=imageCache.get(m.id);if(!img||img._src!==m.image){img=new Image();img._src=m.image;img.src=m.image;imageCache.set(m.id,img);img.onload=()=>{if(ctx.canvas.isConnected){if(ctx.canvas.id==='editorCanvas')drawEditor();else drawBattle()}}}if(img.complete&&img.naturalWidth){ctx.globalAlpha=.75;ctx.drawImage(img,0,0,900,500);ctx.globalAlpha=1}}if(m?.path?.length){ctx.beginPath();m.path.forEach((p,i)=>i?ctx.lineTo(p.x*900,p.y*500):ctx.moveTo(p.x*900,p.y*500));ctx.lineWidth=24;ctx.strokeStyle='#273650';ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();ctx.beginPath();m.path.forEach((p,i)=>i?ctx.lineTo(p.x*900,p.y*500):ctx.moveTo(p.x*900,p.y*500));ctx.lineWidth=3;ctx.setLineDash([10,10]);ctx.strokeStyle='#ff6688';ctx.stroke();ctx.setLineDash([]);const a=m.path[0],b=m.path[m.path.length-1];ctx.fillStyle='#67e8b0';ctx.beginPath();ctx.arc(a.x*900,a.y*500,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0d1724';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('S',a.x*900,a.y*500+4);ctx.fillStyle='#ffd477';ctx.beginPath();ctx.arc(b.x*900,b.y*500,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#332616';ctx.fillText('G',b.x*900,b.y*500+4)}}
function drawEditor(){const c=$('#editorCanvas');if(!c)return;const ctx=c.getContext('2d'),m=activeMap();drawMap(ctx,m);for(const z of m.zones||[]){ctx.beginPath();ctx.arc(z.x*900,z.y*500,z.r*900,0,Math.PI*2);ctx.fillStyle='#67e8b022';ctx.fill();ctx.strokeStyle='#67e8b0';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#aaffd9';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('UNIT',z.x*900,z.y*500+4)}(m.path||[]).forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x*900,p.y*500,8,0,Math.PI*2);ctx.fillStyle=i===0?'#67e8b0':i===m.path.length-1?'#ffd477':'#ff6688';ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.fillText(i===0?'S':i===m.path.length-1?'G':i+1,p.x*900,p.y*500-12)});c.onpointerdown=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;const px=x*900,py=y*500;const near=(m.path||[]).findIndex(p=>Math.hypot(p.x*900-px,p.y*500-py)<16);const nz=(m.zones||[]).findIndex(z=>Math.hypot(z.x*900-px,z.y*500-py)<25);if(editorMode==='zones'){if(nz>=0){dragZone=nz;c.setPointerCapture(e.pointerId)}else{m.zones.push({id:id('z'),x,y,r:.05});save();drawEditor();$('#zoneCount').textContent=m.zones.length}return}if(editorMode==='spawn'||editorMode==='goal'){if(!m.path.length)m.path=[{x:.06,y:.5},{x:.94,y:.5}];if(editorMode==='spawn')m.path[0]={x,y};else m.path[m.path.length-1]={x,y};editorMode='path';save();drawEditor();return}if(near>=0){dragPoint=near;c.setPointerCapture(e.pointerId)}else{m.path.push({x,y});save();drawEditor();$('#pathCount').textContent=m.path.length}};c.onpointermove=e=>{if(dragPoint<0&&dragZone<0)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if(dragPoint>=0)m.path[dragPoint]={x,y};if(dragZone>=0){m.zones[dragZone].x=x;m.zones[dragZone].y=y}drawEditor()};c.onpointerup=()=>{if(dragPoint>=0||dragZone>=0)save();dragPoint=-1;dragZone=-1};c.onpointercancel=()=>{dragPoint=-1;dragZone=-1}}
function wireCollection(){$('#openChest')?.addEventListener('click',()=>{if(data.wins<=data.chestsClaimed)return toast('Bạn chưa có rương mới. Hãy thắng một ván trước nhé.');const owned=new Set(data.collection);const pool=data.characters.filter(c=>c.chestEnabled!==false&&!owned.has(c.id));data.chestsClaimed++;if(pool.length){const c=pool[Math.floor(Math.random()*pool.length)];if(!data.collection.includes(c.id))data.collection.push(c.id);data.shards+=25;save();render();toast('🎁 Nhận được '+c.name+'! Nhân vật này đã được loại khỏi bể quay nên sẽ không ra lần nữa.','success')}else{data.shards+=100;save();render();toast('Bạn đã sở hữu toàn bộ nhân vật trong bể! Nhận 100 shards thay cho nhân vật trùng.','success')}})}
function wireSettings(){$('#soundSetting')?.addEventListener('change',e=>data.settings.sound=e.target.checked);$('#defaultSpeed')?.addEventListener('change',e=>data.settings.speed=+e.target.value);$('#saveSettings')?.addEventListener('click',()=>{save();toast('Đã lưu cài đặt.','success')});$('#resetData')?.addEventListener('click',()=>{if(confirm('Khôi phục toàn bộ dữ liệu mẫu? Dữ liệu hiện tại sẽ mất.')){data=clone(DEFAULTS);data.campaign[0].waves=makeWaves(data.monsters);battle=null;editIndex=null;selectedChar=null;save();render();toast('Đã khôi phục dữ liệu mẫu.')}});$('#exportBtn2')?.addEventListener('click',exportProject);$('#importBtn2')?.addEventListener('click',()=>$('#importFile').click())}
function exportProject(){try{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dominate-the-world-td-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Đã xuất dữ liệu dự án.','success')}catch(e){toast('Xuất dữ liệu thất bại.','error')}}
$('#exportBtn').addEventListener('click',exportProject);$('#importBtn').addEventListener('click',()=>$('#importFile').click());$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.characters||!x.monsters||!x.maps||!x.campaign)throw new Error('missing');if(!confirm('Nhập dự án sẽ thay thế dữ liệu hiện tại. Tiếp tục?'))return;data=Object.assign(clone(DEFAULTS),x);ensure();save();battle=null;editIndex=null;render();toast('Đã nhập dự án.','success')}catch(err){toast('JSON không hợp lệ hoặc thiếu dữ liệu dự án.','error')}finally{e.target.value=''}};r.readAsText(f)});
render();
})();
</script></body></html>
