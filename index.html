<style>
:root{--bg:#0b0d18;--panel:#14182a;--panel2:#1b2036;--line:#303855;--text:#eef1ff;--muted:#a4acc9;--purple:#9b72ff;--blue:#55c8ff;--gold:#ffd477;--red:#ff6688;--green:#67e8b0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b1c3a 0,#0b0d18 60%);color:var(--text);font:14px/1.45 Inter,system-ui,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{border:1px solid #424a6e;background:#252b46;color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer;transition:.15s}button:hover{border-color:var(--blue);background:#303858}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:linear-gradient(120deg,#8057ef,#426fe8);border:0}.danger{border-color:#824055;color:#ff9ab0}.good{border-color:#286b61;color:#8cf0cc}.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.sidebar{padding:22px 14px;background:#0a0c16;border-right:1px solid #252b42;display:flex;flex-direction:column;gap:8px}.brand{font-weight:900;letter-spacing:.08em;font-size:15px;margin:4px 8px 20px}.brand span{color:var(--blue)}.nav{width:100%;text-align:left;background:transparent;border-color:transparent;color:#b5bdd9;padding:12px}.nav.active{background:linear-gradient(90deg,#6e4bd633,#4daaff17);border-color:#4a4f83;color:white}.sidefoot{margin-top:auto;color:#737d9f;font-size:12px;padding:10px}.main{min-width:0;padding:20px clamp(12px,2vw,28px)}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.topbar h1{font-size:clamp(20px,2.2vw,28px);margin:0}.sub{color:var(--muted);font-size:12px}.resources{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#151a2b;color:#dce4ff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.panel{background:linear-gradient(160deg,#171b2f,#111524);border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0;box-shadow:0 8px 30px #0002}.panel h2,.panel h3{margin:0 0 12px}.panel h2{font-size:17px}.panel h3{font-size:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.field input,.field select,.field textarea{width:100%;min-width:0;background:#0d1120;color:var(--text);border:1px solid #353d5c;border-radius:8px;padding:9px}.field textarea{min-height:70px;resize:vertical}.muted{color:var(--muted)}.small{font-size:12px}.stat{padding:12px;background:#101526;border:1px solid #2b3350;border-radius:11px}.stat b{display:block;font-size:20px}.unitlist{display:flex;flex-direction:column;gap:8px}.unit{display:flex;align-items:center;gap:10px;border:1px solid #303854;background:#13192b;padding:9px;border-radius:11px;cursor:pointer}.unit.selected{border-color:var(--blue);box-shadow:0 0 0 1px #55c8ff33}.unit.used-unit{filter:grayscale(.7)}.avatar{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:22px;flex-shrink:0;background:linear-gradient(135deg,#4c397a,#1d5e7c);border:1px solid #6274a4}.unit .meta{min-width:0;flex:1}.unit .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rarity{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}.canvaswrap{position:relative;border-radius:12px;overflow:hidden;background:#10182a;border:1px solid #3a4364;min-height:350px}.canvaswrap canvas{display:block;width:100%;height:auto;min-height:350px;cursor:crosshair}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:9px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.notice{padding:10px 12px;background:#202742;border:1px solid #3d4a76;border-radius:9px;color:#dce6ff}.notice.error{border-color:#91475b;color:#ffb5c4}.notice.success{border-color:#2b7a68;color:#a6ffdb}.hidden{display:none!important}.tag{font-size:11px;border:1px solid #3b4566;border-radius:6px;padding:3px 6px;color:#c8d5ff}.progress{height:7px;border-radius:9px;background:#242b43;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));width:0}.range{height:1px;background:var(--line);margin:12px 0}.footerhint{color:#7984a7;font-size:11px;margin-top:10px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #3a4360;border-radius:12px}.toast{position:fixed;right:18px;bottom:18px;z-index:9;background:#1c2640;border:1px solid #4b6191;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px #0008;max-width:min(90vw,420px)}.maptools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.waveitem{display:grid;grid-template-columns:50px 1fr 100px;gap:8px;align-items:center;padding:8px;border:1px solid #2c3550;border-radius:9px;margin-bottom:7px}.waveitem input,.waveitem select{width:100%;min-width:0;background:#0d1120;color:white;border:1px solid #343d5d;padding:7px;border-radius:7px}.skill{display:inline-block;padding:4px 7px;border-radius:6px;background:#232945;color:#b9d9ff;margin:2px;font-size:11px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.app{grid-template-columns:175px minmax(0,1fr)}.sidebar{padding:14px 8px}.nav{padding:10px 8px}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.app{display:block}.sidebar{position:sticky;top:0;z-index:5;flex-direction:row;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:4px}.brand,.sidefoot{display:none}.nav{white-space:nowrap;width:auto;padding:9px}.main{padding:12px}.grid2,.grid3{grid-template-columns:1fr}.canvaswrap canvas{min-height:260px}.panel{padding:12px}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand">DOMINATE <span>THE WORLD</span><div class="sub">TOWER DEFENSE // MVP</div></div>
<button class="nav active" data-tab="Battle">⚔ Battle</button><button class="nav" data-tab="Characters">✦ Characters</button><button class="nav" data-tab="Monsters">☠ Monsters</button><button class="nav" data-tab="Map Editor">⌖ Map Editor</button><button class="nav" data-tab="Campaign">▤ Campaign</button><button class="nav" data-tab="Collection">♜ Nhân vật sở hữu</button><button class="nav" data-tab="Shop">🛒 Shop</button><button class="nav" data-tab="Settings">⚙ Settings</button><div class="sidefoot">Build your world.<br>Defend your realm.</div></aside>
<main class="main"><header class="topbar"><div><h1 id="pageTitle">Battlefield</h1><div class="sub" id="pageSub">Deploy units. Survive 12 waves. Protect the goal.</div></div><div class="resources"><span class="pill">✧ <b id="topGems">0</b> shards</span><span class="pill">🏆 <b id="topWins">0</b> wins</span><button id="exportBtn" data-admin-only hidden>Export Project</button><button id="importBtn" data-admin-only hidden>Import</button><input id="importFile" type="file" accept=".json,application/json" hidden></div></header>
<div id="toast" class="toast hidden"></div>

<div id="account-panel" style="padding:12px;margin:12px 0;border:1px solid #444;border-radius:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <input id="auth-email" type="email" placeholder="Email" autocomplete="email" style="padding:10px;min-width:180px;flex:1">
  <input id="auth-password" type="password" placeholder="Mật khẩu" autocomplete="current-password" style="padding:10px;min-width:150px;flex:1">
  <button id="auth-register" type="button">Đăng ký</button>
  <button id="auth-login" type="button">Đăng nhập</button>
  <button id="auth-logout" type="button" hidden>Đăng xuất</button>
  <span id="auth-status" style="width:100%;font-size:13px">Chưa đăng nhập</span>
</div>

<section id="view"></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const COLORS={Hỏa:'#ff765f',Thủy:'#55c8ff',Thổ:'#c8a879',Mộc:'#75e69c',Băng:'#a4f2ff',Lôi:'#f9e46b',Kim:'#d5dbe9',Phong:'#b2ffd8',Quang:'#fff0a6',Ảnh:'#bc8bff'};
const DEFAULTS={
characters:[
{id:'c1',name:'Yasima',desc:'Kiếm sĩ thủy hệ từ làng chài.',rarity:'Epic',element:'Thủy',cost:120,damage:24,range:135,rate:1.1,type:'single',projectile:360,passive:'Đòn đánh làm chậm nhẹ.',skills:'Sóng Xoáy',cooldown:8,levels:[{damage:24,cost:0},{damage:34,cost:90},{damage:48,cost:150}],icon:'🌊'},
{id:'c2',name:'Hoshina',desc:'Pháp sư băng kiểm soát chiến trường.',rarity:'Rare',element:'Băng',cost:90,damage:15,range:120,rate:1.4,type:'aoe',projectile:300,passive:'Làm chậm mục tiêu.',skills:'Băng Kết',cooldown:10,levels:[{damage:15,cost:0},{damage:23,cost:70},{damage:34,cost:120}],icon:'❄️'},
{id:'c3',name:'Kaizen',desc:'Xạ thủ lôi hệ tấn công nhanh.',rarity:'Legendary',element:'Lôi',cost:180,damage:18,range:155,rate:2.0,type:'chain',projectile:500,passive:'Có thể lan sang kẻ địch gần.',skills:'Lôi Phạt',cooldown:7,levels:[{damage:18,cost:0},{damage:28,cost:120},{damage:42,cost:180}],icon:'⚡'}
],
monsters:[
{id:'m1',name:'Slime bóng tối',role:'normal',hp:90,speed:42,armor:0,reward:12,size:10,color:'#9b72ff',resist:'Ảnh',immune:'',ability:'',icon:'●'},
{id:'m2',name:'Lang sói',role:'fast',hp:65,speed:70,armor:0,reward:10,size:8,color:'#ff9b75',resist:'',immune:'Băng',ability:'',icon:'◆'},
{id:'m3',name:'Kỵ sĩ cổ đại',role:'armored',hp:260,speed:25,armor:7,reward:24,size:13,color:'#c3d3e8',resist:'Kim',immune:'',ability:'shield',icon:'⬟'},
{id:'m4',name:'Long vương',role:'boss',hp:1500,speed:22,armor:12,reward:160,size:20,color:'#ff5c85',resist:'Hỏa',immune:'',ability:'regen',icon:'♛'}
],
maps:[{id:'map1',name:'Thung lũng Khởi Nguyên',image:null,path:[{x:.06,y:.5},{x:.22,y:.5},{x:.22,y:.25},{x:.5,y:.25},{x:.5,y:.72},{x:.78,y:.72},{x:.78,y:.48},{x:.94,y:.48}],zones:[{id:'z1',x:.14,y:.78,r:.055},{id:'z2',x:.36,y:.48,r:.05},{id:'z3',x:.62,y:.42,r:.055},{id:'z4',x:.88,y:.2,r:.06}],width:900,height:500}],
campaign:[{id:'stage1',name:'Thung lũng Khởi Nguyên',mapId:'map1',difficulty:1,lives:20,gold:350,reward:100,waves:[]}],
settings:{sound:false,speed:1},collection:['c1','c2','c3'],equipped:['c1','c2','c3'],wins:0,shards:0,chestsClaimed:0,completed:[]
};
function clone(x){return JSON.parse(JSON.stringify(x))}
function awaitFileData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{try{const max=512,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');if(!ctx)throw new Error('canvas');ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/webp',.78))}catch(err){reject(err)}};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
const imageCache=new Map(),characterImageCache=new Map();
let data=loadData(),tab='Battle',selectedChar=null,selectedMonster=null,selectedMap=null,selectedStage=null,editorMode='path',dragPoint=-1,dragZone=-1,editIndex=null,uploadImage=null,battle=null,loopId=null,lastFrame=0,toastTimer=null,showRange=true;
function loadData(){try{const x=JSON.parse(localStorage.getItem('dtwtd_data'));if(x&&x.characters&&x.monsters&&x.maps&&x.campaign)return Object.assign(clone(DEFAULTS),x)}catch(e){}const d=clone(DEFAULTS);d.campaign[0].waves=makeWaves(d.monsters);return d}
function makeWaves(monsters){return Array.from({length:12},(_,i)=>({count:7+i*2,interval:0.8,break:3,health:1+i*.13,speed:1+i*.025,boss:i===11,monsterId:i===11?'m4':(i%4===2?'m3':i%3===1?'m2':'m1'),rules:{hp:1,elementBonus:'',elementResist:'',attackRate:1,limit:0}}))}
function ensure(){if(!data.campaign[0].waves||data.campaign[0].waves.length!==12)data.campaign[0].waves=makeWaves(data.monsters);for(const s of data.campaign){if(!s.waves||s.waves.length!==12)s.waves=makeWaves(data.monsters)}}
ensure();
window.addEventListener('dtw-cloud-request-local',()=>window.dispatchEvent(new CustomEvent('dtw-cloud-save',{detail:playerSaveData()})));
window.addEventListener('dtw-cloud-reset-player',()=>{data.collection=clone(DEFAULTS.collection);data.equipped=clone(DEFAULTS.equipped);data.wins=DEFAULTS.wins;data.shards=DEFAULTS.shards;data.chestsClaimed=DEFAULTS.chestsClaimed;data.completed=clone(DEFAULTS.completed);data.settings=clone(DEFAULTS.settings);try{localStorage.setItem('dtwtd_data',JSON.stringify(data))}catch(e){}render()});
function playerSaveData(){return {schemaVersion:1,playerState:{collection:clone(data.collection||[]),equipped:clone(data.equipped||[]),wins:Number(data.wins)||0,shards:Number(data.shards)||0,chestsClaimed:Number(data.chestsClaimed)||0,completed:clone(data.completed||[]),settings:{sound:!!data.settings?.sound,speed:Number(data.settings?.speed)||1}}}}
window.addEventListener('dtw-cloud-load',event=>{const incoming=event.detail?.data;if(!incoming||typeof incoming!=='object')return;const state=incoming.playerState||incoming;if(Array.isArray(state.collection))data.collection=state.collection.filter(id=>data.characters.some(c=>c.id===id));if(Array.isArray(state.equipped))data.equipped=state.equipped.filter(id=>data.collection.includes(id)).slice(0,4);if(Number.isFinite(Number(state.wins)))data.wins=Math.max(0,Number(state.wins));if(Number.isFinite(Number(state.shards)))data.shards=Math.max(0,Number(state.shards));if(Number.isFinite(Number(state.chestsClaimed)))data.chestsClaimed=Math.max(0,Number(state.chestsClaimed));if(Array.isArray(state.completed))data.completed=clone(state.completed);if(state.settings&&typeof state.settings==='object'){data.settings.sound=!!state.settings.sound;const speed=Number(state.settings.speed);if([1,1.5,2,3].includes(speed))data.settings.speed=speed;}ensure();try{localStorage.setItem('dtwtd_data',JSON.stringify(data))}catch(e){}render();});
function save(){try{localStorage.setItem('dtwtd_data',JSON.stringify(data));window.dispatchEvent(new CustomEvent('dtw-cloud-save',{detail:playerSaveData()}));return true}catch(e){toast('Không thể lưu: dữ liệu có thể quá lớn. Hãy giảm kích thước ảnh bản đồ hoặc Export Project.','error');return false}}
function toast(msg,type=''){const el=$('#toast');el.textContent=msg;el.className='toast'+(type?' '+type:'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3500)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return Math.round(n).toLocaleString('vi-VN')}
function id(prefix){return prefix+Math.random().toString(36).slice(2,9)}
function activeMap(){return data.maps.find(m=>m.id===(selectedMap||data.campaign[0]?.mapId))||data.maps[0]}
function editorMap(){return data.maps.find(m=>m.id===editIndex)||activeMap()}
function activeStage(){return data.campaign.find(s=>s.id===selectedStage)||data.campaign[0]}
function nav(t){if(userRole!=='admin'&&['Characters','Monsters','Map Editor','Campaign'].includes(t)){toast('Chỉ Admin mới được chỉnh sửa nội dung game.','error');return}if(battle&&battle.running&&!battle.paused){toast('Hãy tạm dừng trận đấu trước khi chuyển tab.');return}tab=t;$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('#pageTitle').textContent=({Battle:'Battlefield',Characters:'Character Forge',Monsters:'Monster Lab','Map Editor':'Map Editor',Campaign:'Campaign Builder',Collection:'Nhân vật sở hữu',Shop:'Shop nhân vật',Settings:'Settings'})[t]||t;$('#pageSub').textContent=({Battle:'Triển khai nhân vật, sống sót qua 12 wave.',Characters:'Tạo và cân bằng các đơn vị chiến đấu.',Monsters:'Thiết kế quái vật và vai trò trong wave.','Map Editor':'Tải ảnh nền, vẽ đường đi và vùng đặt nhân vật.',Campaign:'Cấu hình màn chơi và luật từng wave.',Collection:'Danh sách nhân vật sở hữu và đội hình đã trang bị.',Shop:'Mua nhân vật bằng shards.',Settings:'Lưu trữ và tùy chỉnh trải nghiệm.'})[t];render()}
$$('.nav').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.tab)));
function updateHeader(){$('#topGems').textContent=fmt(data.shards);$('#topWins').textContent=data.wins}
function render(){updateHeader();const v=$('#view');if(tab==='Battle')v.innerHTML=renderBattle();if(tab==='Characters')v.innerHTML=renderCharacters();if(tab==='Monsters')v.innerHTML=renderMonsters();if(tab==='Map Editor'){if(!data.maps.length)data.maps=clone(DEFAULTS.maps);if(!editIndex||!data.maps.some(x=>x.id===editIndex))editIndex=(selectedMap&&data.maps.some(x=>x.id===selectedMap)?selectedMap:data.maps[0].id);v.innerHTML=renderMapEditor();drawEditor()}if(tab==='Campaign')v.innerHTML=renderCampaign();if(tab==='Collection')v.innerHTML=renderCollection();if(tab==='Shop')v.innerHTML=renderShop();if(tab==='Settings')v.innerHTML=renderSettings();if(tab==='Battle')drawBattle();wireTab()}
function characterVisual(c,size=42){return c?.image?`<img src="${c.image}" alt="${esc(c.name||'Nhân vật')}" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:11px;flex-shrink:0">`:`<div class="avatar" style="color:${COLORS[c?.element]||'#fff'}">${esc(c?.icon||'✦')}</div>`}
function unitCard(c,kind='char'){return `<div class="unit ${((kind==='char'?selectedChar:selectedMonster)===c.id?'selected':'')}" data-select-${kind}="${c.id}">${kind==='char'?characterVisual(c):`<div class="avatar" style="color:${COLORS[c.element]||c.color||'#fff'}">${esc(c.icon||'✦')}</div>`}<div class="meta"><b>${esc(c.name)}</b><span class="sub">${esc(c.element||c.role||'')} · ${esc(c.rarity||c.role||'')}</span></div><span class="tag">${kind==='char'?c.cost+' ✧':c.hp+' HP'}</span></div>`}
function renderBattle(){const stage=activeStage(),map=data.maps.find(m=>m.id===stage.mapId)||activeMap();return `<div class="layout"><div class="stack"><div class="panel"><div class="row between"><div><h2>⚔ ${esc(stage.name)}</h2><div class="sub">Map: ${esc(map.name)} · ${stage.waves.length} waves</div></div><div class="row"><button id="startBtn" class="primary" ${battle?.running?'disabled':''}>▶ ${battle?.ended?'Chơi lại':'Bắt đầu'}</button><button id="pauseBtn" ${!battle?.running?'disabled':''}>Ⅱ ${battle?.paused?'Tiếp tục':'Tạm dừng'}</button><button id="speedBtn">⏩ ${data.settings.speed}x</button></div></div><div class="canvaswrap"><canvas id="battleCanvas" width="900" height="500"></canvas></div><div class="legend"><span><i class="dot" style="background:#ff6688"></i>Quái</span><span><i class="dot" style="background:#55c8ff"></i>Nhân vật</span><span><i class="dot" style="background:#ffd477"></i>Goal</span><span>Nhấp bất kỳ đâu trên bản đồ để đặt đơn vị</span></div></div><div class="panel"><div class="row between"><h2>Đội hình</h2><span class="sub" id="battleStatus">${battle?.ended?(battle.won?'CHIẾN THẮNG':'THẤT BẠI'):(battle?.running?'ĐANG CHIẾN ĐẤU':'SẴN SÀNG')}</span></div><div class="grid3"><div class="stat"><span class="sub">Tài nguyên</span><b id="goldVal">${battle?fmt(battle.gold):fmt(stage.gold)}</b></div><div class="stat"><span class="sub">Mạng sống</span><b id="livesVal">${battle?battle.lives:stage.lives}</b></div><div class="stat"><span class="sub">Wave</span><b id="waveVal">${battle?Math.min(12,battle.wave+1):0}/12</b></div></div><div class="progress" style="margin-top:12px"><i id="waveProgress" style="width:${battle?battle.wave/12*100:0}%"></i></div><div class="sub" id="battleMessage" style="margin-top:8px">${battle?.message||'Chọn một nhân vật ở bảng bên phải, sau đó nhấp bất kỳ vị trí nào trên bản đồ để đặt.'}</div></div></div><aside class="stack"><div class="panel"><h2>✦ Chọn nhân vật</h2><div class="unitlist">${(data.characters.filter(c=>(data.equipped||data.collection.slice(0,4)).includes(c.id)&&data.collection.includes(c.id))).map(c=>{const used=!!(battle&&battle.usedCharIds?.includes(c.id));return `<div class="unit ${selectedChar===c.id?'selected':''} ${used?'used-unit':''}" data-select-char="${c.id}" style="${used?'opacity:.48;cursor:not-allowed;':''}">${characterVisual(c)}<div class="meta"><b>${esc(c.name)}</b><span class="sub">${esc((c.elements||[c.element]).join(' / ')||'')} · ${used?'ĐÃ ĐẶT TRẬN NÀY':esc(c.rarity||'')}</span></div><span class="tag">${used?'Đã dùng':c.cost+' ✧'}</span></div>`}).join('')||'<div class="empty">Hãy trang bị tối đa 4 nhân vật trong Collection.</div>'}</div></div><div class="panel" id="selectedInfo"><h2>Thông tin đơn vị</h2>${selectedChar?charInfo(data.characters.find(c=>c.id===selectedChar)):('<p class="muted">Chọn nhân vật để xem chỉ số.</p>')}</div><div class="panel"><h3>Điều khiển</h3><div class="small muted">• Đặt đơn vị ở bất kỳ vị trí nào trên bản đồ.<br>• Chọn đơn vị đã đặt để nâng cấp hoặc bán.<br>• Quái chạm Goal sẽ làm mất mạng.<br>• Tiêu diệt boss ở wave 12 để thắng.</div></div></aside></div>`}
function effectiveElementParams(c,level=0){const params={...(c?.elementParams||{})};for(let i=0;i<=Math.max(0,level);i++)Object.assign(params,c?.levels?.[i]?.elementParams||{});return params}
function charInfo(c,level=0){if(!c)return'<p class="muted">Nhân vật không tồn tại.</p>';const ep=effectiveElementParams(c,level),lv=c.levels?.[level]||{};return `<div class="row">${characterVisual(c,58)}<div><b>${esc(c.name)}</b><div class="rarity">${esc(c.rarity)}</div></div></div><div class="range"></div><div class="grid2"><div><span class="sub">Sát thương</span><b>${c.levels?.[level]?.damage??c.damage}</b></div><div><span class="sub">Tầm đánh</span><b>${c.range}</b></div><div><span class="sub">Tốc độ đánh</span><b>${lv.rate??c.rate}/s</b></div><div><span class="sub">Nguyên tố đã mở</span><b>${esc(effectiveElements(c,level).join(' + '))}</b></div></div><p class="small">${esc(c.desc)}</p><div class="small muted">Nội tại nguyên tố: ${esc(({Hỏa:'Thiêu đốt',Thủy:'Làm chậm',Băng:'Choáng',Lôi:'Đánh lan',Phong:'Đẩy lùi',Mộc:'Hồi máu nhà',Kim:'Buff sát thương đồng minh',Thổ:'Tạo tài nguyên'})[c.element]||c.passive||'Không có')}</div><div class="small muted"><b>Thông số nội tại hiện tại:</b> ${Object.entries(ep).map(([k,v])=>esc(({burnDps:'Hỏa: sát thương đốt/s',burnDuration:'Hỏa: thời gian đốt',slowPercent:'Thủy: % làm chậm',slowDuration:'Thủy: thời gian chậm',stunDuration:'Băng: thời gian choáng',chainCount:'Lôi: số mục tiêu lan',chainPercent:'Lôi: % sát thương lan',chainRange:'Lôi: bán kính lan',pushDistance:'Phong: khoảng đẩy',woodHeal:'Mộc: lượng hồi máu',woodInterval:'Mộc: chu kỳ hồi',metalBuff:'Kim: % buff sát thương',metalRange:'Kim: bán kính buff',earthGold:'Thổ: tài nguyên nhận',earthInterval:'Thổ: chu kỳ tài nguyên'})[k]||k)+': '+v).join(' · ')}</div><div>${(c.skills||'').split(',').filter(Boolean).map(s=>`<span class="skill">${esc(s.trim())}</span>`).join('')}</div><div>${(c.effects||[]).map(e=>`<span class="skill">${({slow:'Làm chậm',burn:'Thiêu đốt',chain:'Đánh lan',splash:'Diện rộng',poison:'Độc',stun:'Choáng'}[e.type]||esc(e.type))} · ${e.power} / ${e.duration}s</span>`).join('')}</div>`}
const LEVEL_PARAM_DEFS={Hỏa:[['burnDps','Sát thương thiêu đốt / giây',6,'0','1'],['burnDuration','Thời gian thiêu đốt (giây)',2,'.1','.1']],Thủy:[['slowPercent','% giảm tốc độ',35,'0','1'],['slowDuration','Thời gian làm chậm (giây)',1.5,'.1','.1']],Băng:[['stunDuration','Thời gian choáng (giây)',.65,'0','.1']],Lôi:[['chainCount','Số mục tiêu lan thêm',1,'0','1'],['chainPercent','% sát thương mỗi lần lan',55,'0','1'],['chainRange','Bán kính tìm mục tiêu (px)',85,'0','5']],Phong:[['pushDistance','Khoảng cách đẩy lùi (px)',45,'0','5']],Mộc:[['woodHeal','Máu nhà hồi mỗi lần',1,'0','1'],['woodInterval','Chu kỳ hồi máu (giây)',8,'.1','.1']],Kim:[['metalBuff','% tăng sát thương đồng minh',25,'0','1'],['metalRange','Bán kính buff (px)',110,'0','5']],Thổ:[['earthGold','Tài nguyên nhận mỗi lần',5,'0','1'],['earthInterval','Chu kỳ tạo tài nguyên (giây)',5,'.1','.1']]};
function levelEditorMarkup(lv={},i=0,c={}){const selected=lv.elements|| (i===0?(c.elements||[c.element||'Thủy']):[]);const ep=lv.elementParams||(i===0?(c.elementParams||{}):{});const elements=Object.keys(COLORS);return '<div class="stat progression-row" style="margin-top:8px"><div class="row between"><b>Cấp '+(i+1)+'</b>'+(i>0?'<button type="button" data-remove-level>✕ Xóa cấp</button>':'<span class="small muted">Cấp khởi đầu</span>')+'</div><div class="field"><b>Nguyên tố mở khóa ở cấp này (chọn nhiều)</b><div class="grid3">'+elements.map(x=>'<label class="field" style="display:flex;align-items:center;gap:6px"><input type="checkbox" data-level-element="'+x+'" '+(selected.includes(x)?'checked':'')+' style="width:auto"><span style="color:'+COLORS[x]+'">'+x+'</span></label>').join('')+'</div><div class="small muted">Các nguyên tố đã mở ở cấp trước vẫn được giữ. Có thể chọn thêm nguyên tố mới tại cấp này.</div></div><div class="grid3"><label class="field">Giá đặt / nâng<input data-level="cost" type="number" min="0" value="'+(i===0?0:(lv.cost??90))+'" '+(i===0?'disabled':'')+'></label><label class="field">Sát thương<input data-level="damage" type="number" min="0" value="'+(lv.damage??c.damage??20)+'"></label><label class="field">Tốc độ đánh / giây<input data-level="rate" type="number" min=".1" max="20" step=".1" value="'+(lv.rate??c.rate??1)+'"></label><label class="field">% sát thương AOE<input data-level="aoePercent" type="number" min="0" value="'+(lv.aoePercent??c.aoePercent??55)+'"></label><label class="field">Bán kính AOE<input data-level="aoeRadius" type="number" min="0" value="'+(lv.aoeRadius??c.aoeRadius??55)+'"></label><label class="field">Loại tấn công<select data-level="type">'+[['single','Đơn mục tiêu'],['aoe','Diện rộng'],['pierce','Xuyên mục tiêu'],['chain','Lan mục tiêu'],['support','Hỗ trợ']].map(([v,l])=>'<option value="'+v+'" '+((lv.type??c.type??'single')===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label><label class="field">Tốc độ đạn<input data-level="projectile" type="number" min="50" value="'+(lv.projectile??c.projectile??350)+'"></label></div><div class="level-element-params">'+elements.map(el=>'<div data-level-param-section="'+el+'" style="display:'+(selected.includes(el)?'block':'none')+'"><b style="color:'+COLORS[el]+'">'+el+' — thông số nội tại</b><div class="grid3">'+(LEVEL_PARAM_DEFS[el]||[]).map(([k,label,def,min,step])=>'<label class="field">'+label+'<input data-level-param="'+k+'" type="number" min="'+min+'" step="'+step+'" value="'+(ep[k]??def)+'"></label>').join('')+'</div></div>').join('')+'</div></div>'}
function effectiveElements(c,level=0){const out=[];for(let i=0;i<=Math.max(0,level);i++)for(const el of (c?.levels?.[i]?.elements|| (i===0?(c?.elements||[c?.element]):[])))if(el&&!out.includes(el))out.push(el);return out}
function renderCharacters(){const c=data.characters.find(x=>x.id===editIndex)||{};return `<style>.char-layout{display:grid;grid-template-columns:minmax(220px,.7fr) minmax(0,1.6fr);gap:14px;align-items:start}.char-form{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.char-form>h3,.char-form>.range,.char-form>.sub,.char-form>button,.char-form>.field[style*="grid-column:1/-1"]{grid-column:1/-1}.char-form .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.char-form .field{min-width:0}.char-form input,.char-form select,.char-form textarea{max-width:100%}.char-form #elementChoices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.char-form #elementChoices label{padding:6px 8px;background:#171f34;border:1px solid #303855;border-radius:8px}.char-form #characterImagePreview img{width:88px!important;height:88px!important;object-fit:cover;border-radius:10px}@media(max-width:850px){.char-layout{grid-template-columns:1fr}}@media(max-width:560px){.char-form{grid-template-columns:1fr}.char-form #elementChoices{grid-template-columns:repeat(3,minmax(0,1fr))}}</style><div class="layout char-layout"><div class="panel"><div class="row between"><h2>Nhân vật của bạn</h2><button class="primary" id="newChar" type="button">＋ Tạo nhân vật</button></div><div class="unitlist">${data.characters.map(x=>`<div class="unit ${x.id===editIndex?'selected':''}" data-edit-char="${x.id}">${characterVisual(x)}<div class="meta"><b>${esc(x.name)}</b><span class="sub">${esc((x.elements||[x.element]).join(' + '))} · ${esc(x.rarity)}</span></div><button data-delete-char="${x.id}" class="danger">Xóa</button></div>`).join('')}</div></div><div class="panel"><h2>${editIndex?'Chỉnh sửa nhân vật':'Tạo nhân vật mới'}</h2><form id="charForm" class="stack char-form"><input type="hidden" name="id" value="${esc(c.id||'')}"><div class="grid2"><label class="field">Tên<input name="name" required maxlength="40" value="${esc(c.name||'')}"></label><label class="field">Biểu tượng emoji<input name="icon" maxlength="8" value="${esc(c.icon||'✨')}"></label><label class="field">Độ hiếm<select name="rarity">${['Common','Rare','Epic','Legendary','Mythic'].map(x=>`<option ${c.rarity===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field" style="display:flex;align-items:center;gap:8px"><input name="chestEnabled" type="checkbox" value="true" ${(c.chestEnabled!==false)?'checked':''} style="width:auto"> Có thể xuất hiện trong rương</label><div class="field" style="grid-column:1/-1"><b>Loại nhận nhân vật</b><div class="grid3"><label class="stat"><input type="radio" name="acquisition" value="chest" ${(c.acquisition||"chest")==="chest"?"checked":""}> 🎁 Mở rương riêng</label><label class="stat"><input type="radio" name="acquisition" value="shards" ${c.acquisition==="shards"?"checked":""}> ✧ Mua bằng shards</label><label class="stat"><input type="radio" name="acquisition" value="starter" ${c.acquisition==="starter"?"checked":""}> ⭐ Nhân vật đầu game</label></div><label class="field">Giá shards<input name="shardPrice" type="number" min="0" value="${c.shardPrice??100}"></label></div><div class="field" style="grid-column:1/-1"><b>Ảnh nhân vật (chỉ 1 ảnh)</b><input id="characterImage" name="characterImage" type="file" accept="image/png,image/jpeg,image/webp"><div class="small muted">Bấm “Chọn tệp” để chọn đúng 1 ảnh PNG/JPG/WebP (tối đa 2 MB), rồi bấm “Lưu nhân vật”.</div><div id="characterImagePreview" style="margin-top:8px">${c.image?`<img src="${c.image}" alt="Ảnh nhân vật" style="width:120px;height:120px;object-fit:cover;border-radius:10px">`:"Chưa chọn ảnh"}</div></div><label class="field">Giá đặt<input name="cost" type="number" min="0" value="${c.cost??100}"></label><div class="field" style="grid-column:1/-1"><div class="row between"><b>Lộ trình nâng cấp theo từng cấp</b><button type="button" id="addProgressionLevel">＋ Thêm cấp</button></div><div class="small muted">Chỉnh trực tiếp từng chỉ số. Cấp 1 là chỉ số ban đầu; từ cấp 2 trở đi đặt giá nâng. Bỏ trống không áp dụng được thay thế bằng giá trị mặc định bên dưới.</div><div id="progressionLevels">${(c.levels?.length?c.levels:[{damage:c.damage??20,cost:0,rate:c.rate??1,aoePercent:c.aoePercent??55,aoeRadius:c.aoeRadius??55,type:c.type??'single',projectile:c.projectile??350,elements:c.elements||[c.element||'Thủy'],elementParams:c.elementParams||{}}]).map((lv,i)=>levelEditorMarkup(lv,i,c)).join('')}</div></div></div><label class="field">Mô tả<textarea name="desc">${esc(c.desc||'')}</textarea></label><label class="field">Nội tại<textarea name="passive">${esc(c.passive||'')}</textarea></label><button class="primary" type="submit">Lưu nhân vật</button><div class="sub">Nhấn Lưu nhân vật để ghi thay đổi vào dữ liệu. Dữ liệu cũng được lưu trong trình duyệt.</div></form></div></div>`}
function renderMonsters(){const m=data.monsters.find(x=>x.id===editIndex)||{};return `<div class="layout"><div class="panel"><div class="row between"><h2>Danh sách quái vật</h2><button id="newMonster" class="primary">＋ Tạo quái</button></div><div class="unitlist">${data.monsters.map(x=>`<div class="unit ${x.id===editIndex?'selected':''}" data-edit-monster="${x.id}"><div class="avatar" style="color:${x.color}">${esc(x.icon||'●')}</div><div class="meta"><b>${esc(x.name)}</b><span class="sub">${esc(x.role)} · ${x.hp} HP</span></div><button class="danger" data-delete-monster="${x.id}">Xóa</button></div>`).join('')}</div></div><div class="panel"><h2>${editIndex?'Chỉnh sửa quái':'Tạo quái vật'}</h2><form id="monsterForm" class="stack"><input type="hidden" name="id" value="${esc(m.id||'')}"><div class="grid2"><label class="field">Tên<input name="name" required value="${esc(m.name||'')}"></label><label class="field">Biểu tượng<input name="icon" value="${esc(m.icon||'●')}"></label><label class="field">Vai trò<select name="role">${[['normal','Quái thường'],['fast','Quái nhanh'],['armored','Giáp cao'],['flying','Quái bay'],['healer','Hồi phục'],['support','Hỗ trợ'],['boss','Boss']].map(([v,l])=>`<option value="${v}" ${m.role===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field">Màu<input name="color" type="color" value="${m.color||'#ff6688'}"></label><label class="field">Máu<input name="hp" type="number" min="1" value="${m.hp??100}"></label><label class="field">Tốc độ<input name="speed" type="number" min="1" value="${m.speed??40}"></label><label class="field">Giáp<input name="armor" type="number" min="0" value="${m.armor??0}"></label><label class="field">Thưởng tài nguyên<input name="reward" type="number" min="0" value="${m.reward??10}"></label><label class="field">Kích thước<input name="size" type="number" min="4" max="40" value="${m.size??10}"></label><label class="field">Kháng nguyên tố<select name="resist"><option value="">Không</option>${Object.keys(COLORS).map(x=>`<option ${m.resist===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Miễn nhiễm trạng thái<input name="immune" value="${esc(m.immune||'')}"></label><label class="field">Kỹ năng đặc biệt<select name="ability">${[['','Không'],['shield','Tạo khiên'],['regen','Hồi máu'],['haste','Tăng tốc'],['summon','Triệu hồi quái nhỏ']].map(([v,l])=>`<option value="${v}" ${m.ability===v?'selected':''}>${l}</option>`).join('')}</select></label></div><button class="primary" type="submit">Lưu quái vật</button></form></div></div>`}
function renderMapEditor(){const m=data.maps.find(x=>x.id===editIndex)||activeMap()||{name:'',path:[],zones:[]};return `<div class="layout"><div class="panel"><div class="row between"><h2>⌖ Trình chỉnh sửa bản đồ</h2><button id="newMap" class="primary">＋ Bản đồ mới</button></div><label class="field">Chọn bản đồ<select id="mapSelect">${data.maps.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="row" style="margin-top:10px"><label class="field" style="flex:1">Tên bản đồ<input id="mapName" value="${esc(m.name)}"></label><label class="field">Tải ảnh nền<input id="mapUpload" type="file" accept="image/png,image/jpeg,image/webp"></label></div><div class="maptools"><button data-mode="path" class="${editorMode==='path'?'primary':''}">✎ Vẽ đường đi</button><button data-mode="zones" class="${editorMode==='zones'?'primary':''}">▣ Vùng đặt</button><button id="undoPoint">↶ Xóa điểm cuối</button><button id="clearPath" class="danger">Xóa đường đi</button><button id="clearZones" class="danger">Xóa vùng</button><button id="setSpawn">Đặt Spawn</button><button id="setGoal">Đặt Goal</button></div><div class="canvaswrap"><canvas id="editorCanvas" width="900" height="500"></canvas></div><div class="legend"><span><i class="dot" style="background:#ff6688"></i>Đường quái</span><span><i class="dot" style="background:#67e8b0"></i>Vùng đặt</span><span><i class="dot" style="background:#ffd477"></i>Goal</span><span>Chế độ đường đi: click thêm điểm; kéo điểm để di chuyển.</span></div><div class="row" style="margin-top:12px"><button class="primary" id="saveMap">Lưu & kiểm tra bản đồ</button><button id="deleteMap" class="danger" ${data.maps.length<=1?'disabled':''}>Xóa bản đồ</button></div><div id="mapValidation" class="footerhint"></div></div><aside class="stack"><div class="panel"><h2>Hướng dẫn nhanh</h2><div class="small muted">1. Tải ảnh nền (không bắt buộc).<br>2. Chọn Vẽ đường đi, nhấp để tạo các điểm từ Spawn đến Goal.<br>3. Chọn Vùng đặt rồi nhấp để thêm vị trí đặt nhân vật.<br>4. Kéo các điểm để chỉnh sửa. Chọn một điểm rồi bấm Xóa điểm cuối để gỡ điểm cuối.</div></div><div class="panel"><h3>Thông tin bản đồ</h3><div class="stat"><span class="sub">Điểm đường đi</span><b id="pathCount">${m.path?.length||0}</b></div><div class="stat" style="margin-top:8px"><span class="sub">Vùng đặt</span><b id="zoneCount">${m.zones?.length||0}</b></div><div class="footerhint">Ảnh nền lưu trong trình duyệt; ảnh quá lớn có thể vượt giới hạn lưu trữ.</div></div></aside></div>`}
function renderCampaign(){const s=data.campaign.find(x=>x.id===editIndex)||activeStage();if(!s)return'<div class="empty">Hãy tạo màn chơi đầu tiên.</div>';return `<div class="layout"><div class="panel"><div class="row between"><h2>▤ Danh sách màn chơi</h2><button id="newStage" class="primary">＋ Tạo màn</button></div>${data.campaign.map(x=>`<div class="unit ${x.id===s.id?'selected':''}" data-edit-stage="${x.id}"><div class="avatar">⚑</div><div class="meta"><b>${esc(x.name)}</b><span class="sub">Độ khó ${x.difficulty} · ${x.waves.length} wave</span></div><button data-delete-stage="${x.id}" class="danger">Xóa</button></div>`).join('')}</div><div class="panel"><h2>Thiết lập màn chơi</h2><form id="stageForm" class="stack"><input type="hidden" name="id" value="${s.id}"><div class="grid2"><label class="field">Tên màn<input name="name" required value="${esc(s.name)}"></label><label class="field">Bản đồ<select name="mapId">${data.maps.map(m=>`<option value="${m.id}" ${s.mapId===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><label class="field">Độ khó<input name="difficulty" type="number" min="1" max="20" value="${s.difficulty}"></label><label class="field">Mạng ban đầu<input name="lives" type="number" min="1" value="${s.lives}"></label><label class="field">Tài nguyên ban đầu<input name="gold" type="number" min="0" value="${s.gold}"></label><label class="field">Phần thưởng thắng<input name="reward" type="number" min="0" value="${s.reward}"></label></div><button class="primary" type="submit">Lưu màn chơi</button></form><div class="range"></div><h3>Cấu hình 12 wave</h3><div class="small muted">Mỗi wave có loại quái, số lượng, nhịp xuất hiện, hệ số máu/tốc độ, boss và luật khắc chế riêng.</div><div id="waveEditor">${s.waves.map((w,i)=>`<div class="waveitem" data-wave="${i}"><b>W${i+1}${w.boss?' ♛':''}</b><div class="stack" style="gap:5px"><select data-wkey="monsterId">${data.monsters.map(m=>`<option value="${m.id}" ${w.monsterId===m.id?'selected':''}>${ function renderCollection(){const owned=data.collection.map(cid=>data.characters.find(c=>c.id===cid)).filter(Boolean);if(!Array.isArray(data.equipped))data.equipped=owned.slice(0,4).map(c=>c.id);data.equipped=data.equipped.filter(cid=>data.collection.includes(cid)&&data.characters.some(c=>c.id===cid)).slice(0,4);const card=c=>{const on=data.equipped.includes(c.id);return '<div class="stat"><div class="row">'+(c.image?'<img src="'+c.image+'" style="width:58px;height:58px;object-fit:cover;border-radius:9px">':'<div class="avatar">'+esc(c.icon||'✦')+'</div>')+'<div><b>'+esc(c.name)+'</b><div class="rarity">'+esc(c.rarity)+'</div></div></div><div class="small muted" style="margin-top:9px">'+esc((c.elements||[c.element]).join(' / '))+' · '+c.damage+' DMG · '+c.range+' range</div><button class="'+(on?'':'primary')+'" data-equip-char="'+c.id+'" style="margin-top:10px;width:100%">'+(on?'✓ Đã trang bị · Bỏ chọn':'＋ Trang bị')+'</button></div>'};return '<div class="panel"><div class="row between"><h2>♜ Nhân vật sở hữu</h2><span class="tag">'+owned.length+' đã sở hữu</span></div><p class="muted small">Danh sách này gồm toàn bộ nhân vật bạn đã nhận. Có thể trang bị tối đa 4 nhân vật vào đội hình.</p><h3>Danh sách nhân vật hiện có</h3><div class="grid3">'+(owned.map(card).join('')||'<div class="empty">Chưa có nhân vật. Hãy mở rương hoặc mua trong Shop.</div>')+'</div><div class="range"></div><h3>Đội hình đã trang bị ('+data.equipped.length+'/4)</h3><div class="grid3">'+(owned.filter(c=>data.equipped.includes(c.id)).map(c=>'<div class="stat">'+(c.image?'<img src="'+c.image+'" style="width:58px;height:58px;object-fit:cover;border-radius:9px">':'<div class="avatar">'+esc(c.icon||'✦')+'</div>')+'<b>'+esc(c.name)+'</b><span class="small muted">'+esc(c.rarity)+'</span></div>').join('')||'<div class="empty">Chưa trang bị nhân vật nào.</div>')+'</div><div class="range"></div><div class="row"><span>Chiến thắng: <b>'+data.wins+'</b></span><span>Rương đã nhận: <b>'+data.chestsClaimed+'</b></span><span>Shards: <b>'+fmt(data.shards)+'</b></span><button id="openChest" class="primary" '+(data.wins<=data.chestsClaimed?'disabled':'')+'>🎁 Mở rương nhân vật</button></div></div>'}
function renderShop(){const items=data.characters.filter(c=>c.acquisition==='shards'&&!data.collection.includes(c.id));return `<div class="panel"><div class="row between"><h2>🛒 Shop nhân vật</h2><span class="tag">✧ ${fmt(data.shards)} shards</span></div><p class="muted small">Dùng shards kiếm được từ chiến thắng để mua nhân vật. Giá do bạn cài trong phần chỉnh sửa nhân vật.</p><div class="grid3">${items.map(c=>`<div class="stat">${c.image?`<img src="${c.image}" style="width:100%;height:150px;object-fit:cover;border-radius:10px">`:`<div class="avatar" style="height:90px;font-size:36px">${esc(c.icon||'✦')}</div>`}<h3>${esc(c.name)}</h3><div class="rarity">${esc(c.rarity)}</div><div class="small muted">${esc(c.desc||'')}</div><div class="row between" style="margin-top:10px"><b>✧ ${fmt(c.shardPrice||0)}</b><button class="primary" data-buy-char="${c.id}" ${data.shards<(c.shardPrice||0)?'disabled':''}>Mua</button></div></div>`).join('')||'<div class="empty">Chưa có nhân vật nào mở bán bằng shards. Vào Characters và chọn “Mua bằng shards”.</div>'}</div></div>`}
function renderSettings(){return `<div class="layout"><div class="panel"><h2>⚙ Cài đặt</h2><div class="stack"><label class="row"><input type="checkbox" id="soundSetting" ${data.settings.sound?'checked':''}> Bật hiệu ứng âm thanh (tùy chọn)</label><label class="field">Tốc độ game mặc định<select id="defaultSpeed">${[1,1.5,2,3].map(n=>`<option value="${n}" ${data.settings.speed===n?'selected':''}>${n}x</option>`).join('')}</select></label><div class="row"><button id="saveSettings" class="primary">Lưu cài đặt</button><button id="resetData" class="danger" data-admin-only ${userRole!=="admin"?"hidden":""}>Khôi phục dữ liệu mẫu</button></div></div></div><div class="panel"><h2>Dữ liệu dự án</h2><p class="muted small">Dữ liệu lưu cục bộ trên trình duyệt này bằng localStorage. Hãy xuất JSON để sao lưu. Ảnh bản đồ lớn có thể khiến trình duyệt từ chối lưu.</p><div class="stat"><span class="sub">Nhân vật / Quái / Bản đồ / Màn chơi</span><b>${data.characters.length} / ${data.monsters.length} / ${data.maps.length} / ${data.campaign.length}</b></div><div class="row" style="margin-top:12px"><button id="exportBtn2" data-admin-only ${userRole!=="admin"?"hidden":""}>Export JSON</button><button id="importBtn2" data-admin-only ${userRole!=="admin"?"hidden":""}>Import JSON</button><div class="range"></div><h3>Phân quyền</h3><div class="notice">${userRole==="admin"?"Admin: bạn có quyền chỉnh sửa và phát hành nội dung chung.":"Player: bạn chỉ có thể chơi và quản lý tiến trình cá nhân."}</div>${userRole==="admin"?'<button id="publishShared" class="primary">Phát hành nội dung cho tất cả người chơi</button>':""}</div></div></div>`}

const levelsBox=$('#progressionLevels');$('#addProgressionLevel')?.addEventListener('click',()=>{if(!levelsBox)return;if(levelsBox.querySelectorAll('.progression-row').length>=30)return toast('Tối đa 30 cấp.');const i=levelsBox.querySelectorAll('.progression-row').length,base=data.characters.find(x=>x.id===editIndex)||{},row=document.createElement('div');row.innerHTML=levelEditorMarkup({damage:base.levels?.[i-1]?.damage??base.damage??20,rate:base.levels?.[i-1]?.rate??base.rate??1,cost:90,aoePercent:base.levels?.[i-1]?.aoePercent??base.aoePercent??55,aoeRadius:base.levels?.[i-1]?.aoeRadius??base.aoeRadius??55,type:base.levels?.[i-1]?.type??base.type??'single',projectile:base.levels?.[i-1]?.projectile??base.projectile??350,elements:effectiveElements(base,i-1),elementParams:effectiveElementParams(base,i-1)},i,base);levelsBox.appendChild(row.firstElementChild)});levelsBox?.addEventListener('click',e=>{const btn=e.target.closest('[data-remove-level]');if(!btn)return;btn.closest('.progression-row')?.remove();levelsBox.querySelectorAll('.progression-row').forEach((row,i)=>{const title=row.querySelector('.row b');if(title)title.textContent='Cấp '+(i+1);const cost=row.querySelector('[data-level="cost"]');if(cost){cost.disabled=i===0;if(i===0)cost.value=0}})});levelsBox?.addEventListener('change',e=>{const row=e.target.closest('.progression-row');if(!row||!e.target.matches('[data-level-element]'))return;const el=e.target.dataset.levelElement,section=row.querySelector('[data-level-param-section="'+el+'"]');if(section)section.style.display=e.target.checked?'block':'none'});
$('#charForm')?.addEventListener('submit',async e=>{
e.preventDefault();
const form=e.currentTarget,submit=form.querySelector('button[type="submit"]');

try{
const fd=new FormData(form),f=Object.fromEntries(fd),old=data.characters.find(c=>c.id===f.id);

const allElements=effectiveElements({levels},levels.length-1),firstParams=levels[0].elementParams;const c={...f,elements:allElements,element:allElements[0],acquisition:f.acquisition||'chest',shardPrice:Math.max(0,+f.shardPrice||0),image:imageData,chestEnabled:(f.acquisition||'chest')==='chest',id:f.id||id('c'),cost:levels[0].cost,damage:levels[0].damage,aoePercent:levels[0].aoePercent,aoeRadius:levels[0].aoeRadius,range:old?.range??130,rate:levels[0].rate,projectile:levels[0].projectile,type:levels[0].type,cooldown:old?.cooldown??8,skills:old?.skills??'',elementParams:firstParams,levels};
const previousCharacters=clone(data.characters),previousCollection=clone(data.collection),previousEdit=editIndex,previousSelected=selectedChar;
if(old)data.characters=data.characters.map(x=>x.id===old.id?c:x);else data.characters.push(c);
if(c.acquisition==='starter'&&!data.collection.includes(c.id))data.collection.push(c.id);

}catch(err){console.error(err);toast('Lưu nhân vật thất bại. Hãy thử lại hoặc kiểm tra ảnh đã chọn.','error')}

$$('[data-edit-monster]').forEach(el=>el.onclick=()=>{editIndex=el.dataset.editMonster;render()});
$$('[data-delete-monster]').forEach(el=>el.onclick=e=>{e.stopPropagation();if(data.monsters.length<=1)return toast('Cần giữ ít nhất một loại quái.','error');const x=data.monsters.find(m=>m.id===el.dataset.deleteMonster);if(confirm('Xóa '+x.name+'?')){data.monsters=data.monsters.filter(m=>m.id!==x.id);data.campaign.forEach(s=>s.waves.forEach(w=>{if(w.monsterId===x.id)w.monsterId=data.monsters[0].id}));editIndex=null;save();render()}});

$('#mapUpload')?.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type)){toast('Ảnh không hợp lệ. Dùng PNG, JPG hoặc WebP.','error');e.target.value='';return}if(file.size>8*1024*1024){toast('Ảnh lớn hơn 8 MB; hãy chọn ảnh nhỏ hơn.','error');e.target.value='';return}const targetId=(editIndex||activeMap().id);const source=new Image();const sourceReader=new FileReader();source.onerror=()=>{toast('Không đọc được ảnh. Hãy thử tệp PNG, JPG hoặc WebP khác.','error');e.target.value=''};sourceReader.onerror=()=>{toast('Không đọc được tệp ảnh.','error');e.target.value=''};sourceReader.onload=()=>{source.src=sourceReader.result};source.onload=()=>{const scale=Math.min(1,1400/source.naturalWidth,800/source.naturalHeight);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(source.naturalWidth*scale));canvas.height=Math.max(1,Math.round(source.naturalHeight*scale));const ctx=canvas.getContext('2d');if(!ctx){toast('Trình duyệt không hỗ trợ xử lý ảnh này.','error');e.target.value='';return}ctx.drawImage(source,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{if(!blob||blob.size>1800*1024){toast('Ảnh vẫn quá lớn sau khi nén. Hãy chọn ảnh có kích thước nhỏ hơn.','error');e.target.value='';return}const compressedReader=new FileReader();compressedReader.onerror=()=>{toast('Không thể chuẩn bị ảnh để lưu.','error');e.target.value=''};compressedReader.onload=()=>{const m=data.maps.find(x=>x.id===targetId);if(!m){toast('Bản đồ đã chọn không còn tồn tại.','error');e.target.value='';return}const previousImage=m.image;m.image=compressedReader.result;if(!save()){m.image=previousImage;e.target.value='';return}imageCache.delete(m.id);render();toast('Đã tải và tối ưu ảnh nền.','success')};compressedReader.readAsDataURL(blob)},'image/webp',.78)};sourceReader.readAsDataURL(file)});

function startBattle(){if(battle?.running&&!battle.ended)return toast('Trận đấu đang chạy.');const stage=activeStage(),map=data.maps.find(m=>m.id===stage.mapId)||activeMap();if(map.path.length<2){toast('Bản đồ cần ít nhất 2 điểm đường đi (Spawn và Goal). Mở Map Editor để sửa.','error');return}battle={running:true,paused:false,ended:false,won:false,usedCharIds:[],stageId:stage.id,mapId:map.id,wave:-1,queue:[],enemies:[],units:[],effects:[],gold:stage.gold,lives:stage.lives,maxLives:stage.lives+3,speed:data.settings.speed,spawnTimer:0,breakTimer:0,spawned:0,dead:0,selectedUnit:null,message:'Chuẩn bị wave đầu tiên…',time:0};lastFrame=performance.now();if(loopId)cancelAnimationFrame(loopId);requestAnimationFrame(tick);render();toast('Trận đấu bắt đầu!','success')}

battle.effects.forEach(e=>e.life-=dt);battle.effects=battle.effects.filter(e=>e.life>0);battle.enemies=battle.enemies.filter(e=>!e.dead);if(w&&battle.spawned>=w.count&&battle.enemies.length===0){battle.breakTimer+=dt;if(battle.breakTimer>=(w.break||3)){if(battle.wave===11)finishBattle(true);else beginWave()}}}

function updateBattleUI(){if(!battle)return;const gold=$('#goldVal'),lives=$('#livesVal'),wave=$('#waveVal'),progress=$('#waveProgress'),message=$('#battleMessage'),status=$('#battleStatus'),pause=$('#pauseBtn'),start=$('#startBtn');if(gold)gold.textContent=fmt(battle.gold);if(lives)lives.textContent=battle.lives;if(wave)wave.textContent=Math.min(12,Math.max(0,battle.wave+1))+'/12';if(progress)progress.style.width=Math.max(0,(battle.wave+1)/12*100)+'%';if(message)message.textContent=battle.message;if(status)status.textContent=battle.ended?(battle.won?'CHIẾN THẮNG':'THẤT BẠI'):battle.paused?'TẠM DỪNG':'ĐANG CHIẾN ĐẤU';if(pause)pause.disabled=!battle.running;if(start)start.disabled=battle.running&&!battle.ended;}
function drawBattle(){const c=$('#battleCanvas');if(!c)return;const ctx=c.getContext('2d');const map=data.maps.find(m=>m.id===(battle?.mapId||activeStage()?.mapId))||activeMap();drawMap(ctx,map);if(!battle)return;for(const z of map.zones){ctx.beginPath();ctx.arc(z.x*900,z.y*500,z.r*900,0,Math.PI*2);ctx.fillStyle='#55c8ff18';ctx.fill();ctx.strokeStyle='#55c8ff66';ctx.stroke()}for(const u of battle.units){const ch=data.characters.find(c=>c.id===u.charId);if(!ch)continue;if(showRange||u.id===battle.selectedUnit){ctx.beginPath();ctx.arc(u.x,u.y,ch.range,0,Math.PI*2);ctx.fillStyle='#55c8ff0b';ctx.fill();ctx.strokeStyle='#55c8ff25';ctx.stroke()}ctx.beginPath();ctx.arc(u.x,u.y,15,0,Math.PI*2);ctx.fillStyle=COLORS[ch.element]||'#55c8ff';ctx.fill();ctx.strokeStyle=u.id===battle.selectedUnit?'#fff':'#a9caff';ctx.lineWidth=2;ctx.stroke();if(ch.image){let portrait=characterImageCache.get(ch.id);if(!portrait||portrait._src!==ch.image){portrait=new Image();portrait._src=ch.image;portrait.src=ch.image;characterImageCache.set(ch.id,portrait);portrait.onload=()=>{if($('#battleCanvas'))drawBattle()}}if(portrait.complete&&portrait.naturalWidth){ctx.save();ctx.beginPath();ctx.arc(u.x,u.y,13,0,Math.PI*2);ctx.clip();ctx.drawImage(portrait,u.x-13,u.y-13,26,26);ctx.restore()}else{ctx.fillStyle='#101526';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText(ch.icon||'✦',u.x,u.y+5)}}else{ctx.fillStyle='#101526';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText(ch.icon||'✦',u.x,u.y+5)}ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.fillText('Lv.'+(u.level+1),u.x,u.y+27)}for(const e of battle.enemies){ctx.beginPath();ctx.arc(e.x,e.y,e.size||10,0,Math.PI*2);ctx.fillStyle=e.color;ctx.fill();ctx.strokeStyle=e.isBoss?'#ffd477':'#ffe4f0';ctx.lineWidth=e.isBoss?3:1;ctx.stroke();const w=e.isBoss?52:30;ctx.fillStyle='#281421';ctx.fillRect(e.x-w/2,e.y-(e.size||10)-9,w,4);ctx.fillStyle='#ff6688';ctx.fillRect(e.x-w/2,e.y-(e.size||10)-9,w*Math.max(0,e.hp/e.maxHp),4)}for(const e of battle.effects){ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.ty);ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.globalAlpha=Math.min(1,e.life*8);ctx.stroke();ctx.globalAlpha=1}}
function drawMap(ctx,m){ctx.clearRect(0,0,900,500);ctx.fillStyle='#11192b';ctx.fillRect(0,0,900,500);ctx.save();ctx.strokeStyle='#34415f';ctx.lineWidth=1.25;for(let x=0;x<900;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke()}for(let y=0;y<500;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}ctx.restore();if(m?.image){let img=imageCache.get(m.id);if(!img||img._src!==m.image){img=new Image();img._src=m.image;img.src=m.image;imageCache.set(m.id,img);img.onload=()=>{if(ctx.canvas.isConnected){if(ctx.canvas.id==='editorCanvas')drawEditor();else drawBattle()}}}if(img.complete&&img.naturalWidth){ctx.globalAlpha=.75;ctx.drawImage(img,0,0,900,500);ctx.globalAlpha=1}}if(m?.path?.length){ctx.beginPath();m.path.forEach((p,i)=>i?ctx.lineTo(p.x*900,p.y*500):ctx.moveTo(p.x*900,p.y*500));ctx.lineWidth=18;ctx.strokeStyle='rgba(18,27,44,.32)';ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();ctx.beginPath();m.path.forEach((p,i)=>i?ctx.lineTo(p.x*900,p.y*500):ctx.moveTo(p.x*900,p.y*500));ctx.lineWidth=2;ctx.setLineDash([9,12]);ctx.strokeStyle='rgba(255,102,136,.72)';ctx.stroke();ctx.setLineDash([]);const a=m.path[0],b=m.path[m.path.length-1];ctx.fillStyle='#67e8b0';ctx.beginPath();ctx.arc(a.x*900,a.y*500,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0d1724';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('S',a.x*900,a.y*500+4);ctx.fillStyle='#ffd477';ctx.beginPath();ctx.arc(b.x*900,b.y*500,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#332616';ctx.fillText('G',b.x*900,b.y*500+4)}}
function drawEditor(){const c=$('#editorCanvas');if(!c)return;const ctx=c.getContext('2d');if(!ctx)return;const m=data.maps.find(x=>x.id===editIndex)||activeMap()||clone(DEFAULTS.maps[0]);drawMap(ctx,m);for(const z of m.zones||[]){ctx.beginPath();ctx.arc(z.x*900,z.y*500,z.r*900,0,Math.PI*2);ctx.fillStyle='#67e8b022';ctx.fill();ctx.strokeStyle='#67e8b0';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#aaffd9';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('UNIT',z.x*900,z.y*500+4)}(m.path||[]).forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x*900,p.y*500,8,0,Math.PI*2);ctx.fillStyle=i===0?'#67e8b0':i===m.path.length-1?'#ffd477':'#ff6688';ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.fillText(i===0?'S':i===m.path.length-1?'G':i+1,p.x*900,p.y*500-12)});c.onpointerdown=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;const px=x*900,py=y*500;const near=(m.path||[]).findIndex(p=>Math.hypot(p.x*900-px,p.y*500-py)<16);const nz=(m.zones||[]).findIndex(z=>Math.hypot(z.x*900-px,z.y*500-py)<25);if(editorMode==='zones'){if(nz>=0){dragZone=nz;c.setPointerCapture(e.pointerId)}else{m.zones.push({id:id('z'),x,y,r:.05});save();drawEditor();$('#zoneCount').textContent=m.zones.length}return}if(editorMode==='spawn'||editorMode==='goal'){if(!m.path.length)m.path=[{x:.06,y:.5},{x:.94,y:.5}];if(editorMode==='spawn')m.path[0]={x,y};else m.path[m.path.length-1]={x,y};editorMode='path';save();drawEditor();return}if(near>=0){dragPoint=near;c.setPointerCapture(e.pointerId)}else{m.path.push({x,y});save();drawEditor();$('#pathCount').textContent=m.path.length}};c.onpointermove=e=>{if(dragPoint<0&&dragZone<0)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if(dragPoint>=0)m.path[dragPoint]={x,y};if(dragZone>=0){m.zones[dragZone].x=x;m.zones[dragZone].y=y}drawEditor()};c.onpointerup=()=>{if(dragPoint>=0||dragZone>=0)save();dragPoint=-1;dragZone=-1};c.onpointercancel=()=>{dragPoint=-1;dragZone=-1}}
function wireShop(){$('[data-buy-char]').forEach(el=>el.onclick=()=>{const c=data.characters.find(x=>x.id===el.dataset.buyChar);if(!c||data.collection.includes(c.id))return;if(c.acquisition!=='shards')return toast('Nhân vật này không được bán trong Shop.','error');const price=Math.max(0,+c.shardPrice||0);if(data.shards<price)return toast('Không đủ shards.','error');data.shards-=price;data.collection.push(c.id);save();render();toast('Đã mua '+c.name+' thành công!','success')})}
function wireCollection(){const view=$('#view');if(view&&!view.dataset.equipDelegation){view.dataset.equipDelegation='1';view.addEventListener('click',e=>{const button=e.target.closest('[data-equip-char]');if(!button||!view.contains(button))return;const cid=String(button.getAttribute('data-equip-char'));if(!Array.isArray(data.collection))data.collection=[];if(!Array.isArray(data.equipped))data.equipped=[];data.collection=data.collection.map(String);data.equipped=data.equipped.map(String).filter(x=>data.collection.includes(x));if(!data.collection.includes(cid))return toast('Bạn chưa sở hữu nhân vật này.','error');if(data.equipped.includes(cid)){data.equipped=data.equipped.filter(x=>x!==cid);save();render();toast('Đã bỏ nhân vật khỏi đội hình.','success');return}if(data.equipped.length>=4)return toast('Mỗi trận chỉ được trang bị tối đa 4 nhân vật.','error');data.equipped.push(cid);save();render();toast('Đã trang bị nhân vật vào đội hình.','success')})}$('#characterImage')?.addEventListener('change',e=>{const file=e.target.files?.[0],preview=$('#characterImagePreview');if(!file||!preview)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>2*1024*1024){toast('Ảnh phải là PNG/JPG/WebP và tối đa 2 MB.','error');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{preview.innerHTML='<img src="'+reader.result+'" alt="Ảnh xem trước" style="width:120px;height:120px;object-fit:cover;border-radius:10px">'};reader.onerror=()=>toast('Không đọc được ảnh.','error');reader.readAsDataURL(file)});$('#openChest')?.addEventListener('click',()=>{if(data.wins<=data.chestsClaimed)return toast('Bạn chưa có rương mới. Hãy thắng một ván trước nhé.');data.chestsClaimed++;const owned=new Set(data.collection);const pool=data.characters.filter(c=>(c.acquisition||'chest')==='chest'&&!owned.has(c.id));if(pool.length&&Math.random()<.65){const c=pool[Math.floor(Math.random()*pool.length)];data.collection.push(c.id);save();render();toast('🎁 Chúc mừng! Bạn nhận được '+c.name+'!','success')}else{save();render();toast('📦 Rương trống! Lần sau may mắn hơn nhé.','error')}})}
function wireSettings(){$('#publishShared')?.addEventListener('click',async()=>{if(userRole!=='admin'||!window.DTWCloud?.publishSharedContent)return toast('Chưa xác thực quyền Admin hoặc chưa kết nối cloud.','error');const content={characters:clone(data.characters),monsters:clone(data.monsters),maps:clone(data.maps),campaign:clone(data.campaign)};if(!confirm('Phát hành nhân vật, quái, bản đồ và chiến dịch hiện tại cho tất cả người chơi?'))return;try{await window.DTWCloud.publishSharedContent(content);toast('Đã phát hành nội dung chung.','success')}catch(e){toast('Phát hành thất bại: '+(e.message||'lỗi quyền truy cập'),'error')}});$('#soundSetting')?.addEventListener('change',e=>{data.settings.sound=e.target.checked;save();toast('Đã lưu cài đặt âm thanh.','success')});$('#defaultSpeed')?.addEventListener('change',e=>{data.settings.speed=+e.target.value;save();toast('Đã lưu tốc độ game.','success')});$('#saveSettings')?.addEventListener('click',()=>{save();toast('Đã lưu cài đặt.','success')});$('#resetData')?.addEventListener('click',()=>{if(userRole!=='admin')return toast('Chỉ Admin được dùng chức năng này.','error');if(confirm('Khôi phục toàn bộ dữ liệu mẫu? Dữ liệu hiện tại sẽ mất.')){data=clone(DEFAULTS);data.campaign[0].waves=makeWaves(data.monsters);battle=null;editIndex=null;selectedChar=null;save();render();toast('Đã khôi phục dữ liệu mẫu.')}});$('#exportBtn2')?.addEventListener('click',exportProject);$('#importBtn2')?.addEventListener('click',()=>$('#importFile').click())}
function exportProject(){if(userRole!=='admin')return toast('Chỉ Admin được xuất dự án.','error');try{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dominate-the-world-td-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Đã xuất dữ liệu dự án.','success')}catch(e){toast('Xuất dữ liệu thất bại.','error')}}
$('#exportBtn').addEventListener('click',exportProject);$('#importBtn').addEventListener('click',()=>{if(userRole==='admin')$('#importFile').click();else toast('Chỉ Admin được nhập dự án.','error')});$('#importFile').addEventListener('change',e=>{if(userRole!=='admin'){e.target.value='';return toast('Chỉ Admin được nhập dự án.','error')}const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.characters||!x.monsters||!x.maps||!x.campaign)throw new Error('missing');if(!confirm('Nhập dự án sẽ thay thế dữ liệu hiện tại. Tiếp tục?'))return;data=Object.assign(clone(DEFAULTS),x);ensure();save();battle=null;editIndex=null;render();toast('Đã nhập dự án.','success')}catch(err){toast('JSON không hợp lệ hoặc thiếu dữ liệu dự án.','error')}finally{e.target.value=''}};r.readAsText(f)});

window.addEventListener('dtw-role-change',e=>{userRole=e.detail?.role==='admin'?'admin':'player';$('[data-admin-only]').forEach(el=>el.hidden=userRole!=='admin');$('.nav').forEach(el=>{const adminTab=['Characters','Monsters','Map Editor','Campaign'].includes(el.dataset.tab);el.hidden=adminTab&&userRole!=='admin'});if(userRole!=='admin'&&['Characters','Monsters','Map Editor','Campaign'].includes(tab))nav('Battle');else render();});
window.addEventListener('dtw-shared-content-load',e=>{if(userRole==='admin')return;const c=e.detail;if(!c||!Array.isArray(c.characters)||!Array.isArray(c.monsters)||!Array.isArray(c.maps)||!Array.isArray(c.campaign))return;data.characters=clone(c.characters);data.monsters=clone(c.monsters);data.maps=clone(c.maps);data.campaign=clone(c.campaign);ensure();render();});
render();
})();
</script></body></html>
