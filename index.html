let data=loadData(),tab='Battle',selectedChar=null,selectedMonster=null,selectedMap=null,selectedStage=null,editorMode='path',dragPoint=-1,dragZone=-1,editIndex=null,uploadImage=null,battle=null,loopId=null,lastFrame=0,toastTimer=null,showRange=true;

function ensure(){for(const k of ['characters','monsters','maps','campaign'])if(!Array.isArray(data[k])||!data[k].length)data[k]=clone(DEFAULTS[k]);const st=data.settings&&typeof data.settings==='object'?data.settings:{};data.settings={...DEFAULTS.settings,...st};data.settings.sound=!!data.settings.sound;if(![1,1.5,2,3].includes(Number(data.settings.speed)))data.settings.speed=1;else data.settings.speed=Number(data.settings.speed);for(const k of ['collection','equipped','completed'])if(!Array.isArray(data[k]))data[k]=clone(DEFAULTS[k]);for(const k of ['shards','wins','chestsClaimed'])if(!Number.isFinite(Number(data[k])))data[k]=DEFAULTS[k];if(!data.campaign[0].waves||data.campaign[0].waves.length!==12)data.campaign[0].waves=makeWaves(data.monsters);for(const s of data.campaign){if(!s.waves||s.waves.length!==12)s.waves=makeWaves(data.monsters)}}
